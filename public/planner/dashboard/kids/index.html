<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <style>
    @property --accent { syntax: '<color>'; inherits: true; initial-value: oklch(0.82 0.13 215); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #08090f;
      --grid:      rgba(150,170,255,0.045);
      --panel:     #0d0e16;
      --panel-2:   #11121d;
      --line:      rgba(190,200,255,0.10);
      --line-soft: rgba(190,200,255,0.06);
      --ink:       #eef1ff;
      --dim:       rgba(225,230,255,0.52);
      --faint:     rgba(225,230,255,0.30);
      --mono:      'Share Tech Mono', ui-monospace, monospace;
      --display:   'Chakra Petch', system-ui, sans-serif;
      --glow:      color-mix(in oklab, var(--accent), transparent 55%);
      --glow-soft: color-mix(in oklab, var(--accent), transparent 80%);
      --tint:      color-mix(in oklab, var(--accent), transparent 90%);
      --tint-2:    color-mix(in oklab, var(--accent), transparent 84%);
    }

    html, body { height: 100%; }
    body {
      background:
        radial-gradient(1100px 700px at 50% -8%, rgba(120,150,255,0.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: grid;
      place-content: start center;
      padding: 28px 18px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 42%, #000 35%, transparent 92%);
    }

    /* ── Frame ── */
    .frame {
      position: relative; z-index: 1;
      width: min(1100px, 100%);
      border-radius: 22px; padding: 2px;
      background: linear-gradient(125deg,
        oklch(0.74 0.2 350), oklch(0.8 0.16 215) 32%,
        oklch(0.86 0.16 95) 64%, oklch(0.78 0.18 35) 100%);
      background-size: 280% 280%;
      animation: borderflow 16s ease infinite;
      box-shadow:
        0 0 0 1px rgba(0,0,0,0.6),
        0 30px 80px -20px rgba(0,0,0,0.85),
        0 0 60px -12px oklch(0.8 0.16 215 / 0.35),
        0 0 90px -20px oklch(0.74 0.2 350 / 0.3);
    }
    @keyframes borderflow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .window {
      position: relative; border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), transparent 120px),
        var(--panel);
      overflow: hidden;
    }
    .window::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay; opacity: 0.5;
    }

    /* ── Titlebar ── */
    .titlebar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
    }
    .tl { display: flex; gap: 8px; }
    .tl i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .tl .r { background: #ff5f57; box-shadow: 0 0 10px #ff5f5780; }
    .tl .y { background: #febc2e; box-shadow: 0 0 10px #febc2e80; }
    .tl .g { background: #28c840; box-shadow: 0 0 10px #28c84080; }
    .tb-name { margin-left: 4px; font-size: 11px; letter-spacing: 0.28em; color: var(--faint); text-transform: uppercase; flex: 1; }
    .tb-status { font-size: 11px; letter-spacing: 0.24em; color: var(--faint); display: flex; align-items: center; gap: 7px; }
    .live { width: 7px; height: 7px; border-radius: 50%; background: #28c840; box-shadow: 0 0 9px #28c840; animation: blink 2.6s steps(1) infinite; }
    @keyframes blink { 0%,70%{opacity:1} 71%,100%{opacity:0.25} }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 2px; padding: 0 16px; position: relative; z-index: 2;
      border-bottom: 1px solid var(--line-soft);
      background: linear-gradient(180deg, rgba(255,255,255,0.018), transparent);
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative; display: inline-flex; align-items: center; gap: 9px;
      font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.18em;
      color: var(--faint); background: none; border: none; cursor: pointer; white-space: nowrap;
      padding: 15px 20px 14px; transition: color 0.16s ease;
    }
    .tab-ico { display: grid; place-items: center; opacity: 0.65; font-size: 16px; }
    .tab:hover { color: var(--dim); }
    .tab.on { color: var(--tc); text-shadow: 0 0 12px color-mix(in oklab, var(--tc), transparent 45%); }
    .tab.on .tab-ico { opacity: 1; filter: drop-shadow(0 0 7px var(--tc)); }
    .tab.on::after {
      content: ''; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px;
      background: var(--tc); box-shadow: 0 0 10px var(--tc); border-radius: 2px;
    }

    /* ── App ── */
    .app { padding: 26px 30px 30px; position: relative; z-index: 2; }
    .panel { display: none; }
    .panel.on { display: block; }

    /* ── HUD ── */
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
    .hud-left { display: flex; align-items: center; gap: 14px; flex: none; }
    .hud-logo { color: var(--accent); filter: drop-shadow(0 0 9px var(--glow)); display: grid; place-items: center; }
    .hud-title { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; margin: 0; line-height: 1; white-space: nowrap; }
    .hud-sub { font-size: 11.5px; letter-spacing: 0.22em; color: var(--dim); margin-top: 6px; }
    .hud-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .week-nav { display: flex; gap: 6px; align-items: center; }
    .wk-btn {
      display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--dim);
      cursor: pointer; font-size: 16px; line-height: 1; transition: all 0.16s ease;
    }
    .wk-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px -6px var(--glow); }
    .wk-this-btn {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim); cursor: pointer; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel-2); transition: all 0.16s ease;
    }
    .wk-this-btn:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Profile pills ── */
    .players { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;
      color: var(--faint); cursor: pointer; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel-2);
      transition: all 0.16s ease; text-transform: uppercase; white-space: nowrap;
    }
    .pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); flex: none; opacity: 0.7; }
    .pill:hover { color: var(--dim); border-color: color-mix(in oklab, var(--pc), transparent 45%); }
    .pill.on {
      color: var(--ink);
      border-color: color-mix(in oklab, var(--pc), transparent 30%);
      background: color-mix(in oklab, var(--pc), transparent 88%);
    }
    .pill.on .pill-dot { opacity: 1; box-shadow: 0 0 8px var(--pc); }
    .fam-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.18em;
      color: var(--faint); cursor: pointer; padding: 7px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel-2);
      transition: all 0.16s ease; text-transform: uppercase; white-space: nowrap;
    }
    .fam-btn:hover { color: var(--dim); }
    .fam-btn.on { color: var(--ink); border-color: var(--accent); background: var(--tint); }

    /* ── Hero ── */
    .hero {
      display: grid; grid-template-columns: 250px 1fr;
      border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
      background:
        radial-gradient(420px 280px at 0% 0%, var(--tint), transparent 70%),
        var(--panel-2);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    }
    .hero.is-today {
      border-color: color-mix(in oklab, var(--accent), transparent 55%);
      box-shadow: 0 0 34px -16px var(--glow), inset 0 0 0 1px var(--glow-soft);
    }
    .hero-rail {
      padding: 26px 24px; border-right: 1px solid var(--line-soft);
      background: linear-gradient(180deg, color-mix(in oklab, var(--accent), transparent 92%), transparent 60%);
      display: flex; flex-direction: column; gap: 4px;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
      font-size: 11px; letter-spacing: 0.3em; font-weight: 700;
      color: var(--accent); padding: 5px 10px; border-radius: 6px;
      border: 1px solid color-mix(in oklab, var(--accent), transparent 55%);
      background: var(--tint); text-shadow: 0 0 10px var(--glow);
    }
    .pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.8s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.5);opacity:0.5} }
    .hero-day { font-family: var(--display); font-weight: 700; font-size: 40px; line-height: 0.98; letter-spacing: 0.02em; margin-top: 16px; color: var(--ink); text-shadow: 0 0 24px var(--glow-soft); }
    .hero-date { font-size: 13px; letter-spacing: 0.24em; color: var(--dim); margin-top: 8px; }
    .hero-count { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 24px; }
    .hero-count-n { font-family: var(--display); font-weight: 700; font-size: 46px; line-height: 1; color: var(--accent); text-shadow: 0 0 22px var(--glow); }
    .hero-count-l { font-size: 10.5px; letter-spacing: 0.22em; color: var(--faint); line-height: 1.5; }
    .back-btn {
      margin-top: 18px; align-self: flex-start;
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
      color: var(--dim); cursor: pointer; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--panel); transition: all 0.16s ease;
    }
    .back-btn:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px -6px var(--glow); }

    .hero-list { padding: 14px 18px; display: flex; flex-direction: column; overflow-y: auto; max-height: 420px; }
    .ev {
      display: grid; grid-template-columns: 52px 28px 1fr; align-items: start; gap: 14px;
      padding: 13px 8px; position: relative; border-bottom: 1px solid var(--line-soft);
    }
    .ev:last-child { border-bottom: none; }
    .ev::before {
      content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 2px;
      border-radius: 2px; background: var(--cat); box-shadow: 0 0 9px var(--cat); opacity: 0.65;
    }
    .ev-time { font-size: 15px; letter-spacing: 0.06em; color: var(--ink); padding-top: 1px; }
    .ev-ico { display: grid; place-items: center; padding-top: 1px; font-size: 18px; filter: drop-shadow(0 0 7px color-mix(in oklab, var(--cat), transparent 45%)); }
    .ev-titleline { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .ev-title { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.01em; color: var(--ink); }
    .ev-tag { font-size: 10px; letter-spacing: 0.22em; opacity: 0.9; white-space: nowrap; }
    .ev-note { font-size: 12.5px; letter-spacing: 0.04em; color: var(--dim); margin-top: 4px; }
    .empty { padding: 38px 8px; text-align: center; color: var(--faint); font-size: 12px; letter-spacing: 0.24em; }

    /* ── Week strip ── */
    .strip-label { display: flex; align-items: center; gap: 14px; margin: 26px 2px 12px; }
    .strip-label > span:first-child { font-size: 12px; letter-spacing: 0.26em; color: var(--dim); }
    .strip-rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
    .strip-hint { font-size: 10.5px; letter-spacing: 0.2em; color: var(--faint); }

    .strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .day-card {
      text-align: left; cursor: pointer; font-family: var(--mono);
      border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px;
      background: var(--panel-2); color: var(--ink);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      display: flex; flex-direction: column; gap: 12px; min-height: 150px;
    }
    .day-card:hover {
      transform: translateY(-3px);
      border-color: color-mix(in oklab, var(--accent), transparent 50%);
      box-shadow: 0 16px 34px -22px var(--accent), 0 0 22px -10px var(--glow);
      background: linear-gradient(180deg, var(--tint), var(--panel-2) 70%);
    }
    .day-card.today { border-color: color-mix(in oklab, var(--accent), transparent 55%); box-shadow: inset 0 0 0 1px var(--glow-soft); }
    .day-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .day-card-day { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: 0.1em; display: inline-flex; align-items: center; gap: 8px; }
    .today-tick { font-size: 8.5px; letter-spacing: 0.2em; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent), transparent 55%); padding: 2px 5px; border-radius: 4px; text-shadow: 0 0 8px var(--glow); }
    .day-card-date { font-size: 11px; letter-spacing: 0.18em; color: var(--dim); }
    .day-card-list { display: flex; flex-direction: column; gap: 9px; }
    .mini-ev { display: flex; align-items: center; gap: 9px; }
    .mini-ico { font-size: 14px; flex: none; filter: drop-shadow(0 0 5px color-mix(in oklab, var(--cat), transparent 55%)); }
    .mini-time { font-size: 11.5px; color: var(--dim); flex: none; width: 38px; }
    .mini-title { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; opacity: 0.92; }
    .mini-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; opacity: 0.85; }
    .mini-empty { font-size: 11.5px; letter-spacing: 0.16em; color: var(--faint); }
    .mini-more { font-size: 11px; letter-spacing: 0.12em; color: var(--accent); opacity: 0.85; }
    .ev-owner { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; letter-spacing: 0.18em; }
    .ev-owner-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

    /* Solo card */
    .day-card-solo { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
    .solo-icon { font-size: 34px; line-height: 1; filter: drop-shadow(0 0 10px var(--glow-soft)); }
    .solo-title { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 0.04em; color: var(--ink); }
    .solo-time  { font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }

    /* Chore War placeholder */
    .coming-soon { text-align: center; padding: 70px 20px; }
    .coming-soon-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.3; filter: drop-shadow(0 0 12px var(--glow)); }
    .coming-soon-title { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.18em; color: var(--accent); text-shadow: 0 0 16px var(--glow); margin-bottom: 8px; }
    .coming-soon-sub { font-size: 11px; letter-spacing: 0.22em; color: var(--faint); }

    /* Footer */
    .sysline { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 0 4px; font-size: 10.5px; letter-spacing: 0.3em; color: var(--faint); }
    .sysline .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: blink 2.2s steps(1) infinite; }

    .loading-msg { text-align: center; padding: 60px 20px; font-size: 11px; letter-spacing: 0.3em; color: var(--faint); animation: blink 1.4s steps(1) infinite; }

    /* ── Responsive ── */
    @media (max-width: 760px) {
      body { padding: 0; }
      .frame { border-radius: 0; padding: 0; }
      .window { border-radius: 0; }
      .app { padding: 18px 14px 22px; }
      .hero { grid-template-columns: 1fr; }
      .hero-rail { border-right: none; border-bottom: 1px solid var(--line-soft); padding: 18px 16px; }
      .hero-day { font-size: 30px; }
      .hero-count { padding-top: 14px; }
      .hero-count-n { font-size: 36px; }
      .strip { grid-template-columns: 1fr 1fr; }
      .hud { gap: 12px; }
      .hud-title { font-size: 20px; }
      .hud-sub { font-size: 10px; }
    }
    @media (max-width: 480px) {
      .strip { grid-template-columns: 1fr; }
      .hud-title { font-size: 17px; }
      .tab { padding: 12px 14px 11px; font-size: 11px; }
      .pill, .fam-btn { padding: 6px 10px; font-size: 9.5px; }
      .hud-right { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .frame, .pulse-dot, .live, .sysline .dot { animation: none !important; }
    }
  </style>
</head>
<body>

<div class="frame">
<div class="window">

  <div class="titlebar">
    <div class="tl"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <div class="tb-name" id="tbName">FAMILY OS // PLANNER</div>
    <div class="tb-status"><span class="live"></span><span id="tbStatus">LOADING</span></div>
  </div>

  <nav class="tabs">
    <button class="tab on" data-tab="planner" style="--tc: var(--accent)">
      <span class="tab-ico">📅</span>WEEKLY PLANNER
    </button>
    <button class="tab" data-tab="war" style="--tc: oklch(0.84 0.18 35)">
      <span class="tab-ico">⚔️</span>CHORE WAR
    </button>
  </nav>

  <!-- PLANNER -->
  <div class="panel on" id="panel-planner">
    <div class="app">
      <div class="hud">
        <div class="hud-left">
          <div class="hud-logo">
            <svg width="30" height="30" viewBox="0 0 46 46" fill="none">
              <rect x="5" y="10" width="36" height="31" rx="4" stroke="currentColor" stroke-width="1.8"/>
              <line x1="5" y1="19" x2="41" y2="19" stroke="currentColor" stroke-width="1.8"/>
              <line x1="15" y1="5" x2="15" y2="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <line x1="31" y1="5" x2="31" y2="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <circle cx="16" cy="27" r="2" fill="currentColor"/>
              <circle cx="23" cy="27" r="2" fill="currentColor"/>
              <circle cx="30" cy="27" r="2" fill="currentColor"/>
              <circle cx="16" cy="34" r="2" fill="currentColor"/>
              <circle cx="23" cy="34" r="2" fill="currentColor"/>
            </svg>
          </div>
          <div>
            <h1 class="hud-title">WEEKLY PLANNER</h1>
            <div class="hud-sub" id="weekLabel"></div>
          </div>
        </div>
        <div class="hud-right">
          <div class="players" id="profilePills"></div>
          <div class="week-nav">
            <button class="wk-this-btn" id="wkThisBtn" onclick="goThisWeek()">THIS WEEK</button>
            <button class="wk-btn" onclick="shiftWeek(-1)">&#8249;</button>
            <button class="wk-btn" onclick="shiftWeek(1)">&#8250;</button>
          </div>
        </div>
      </div>

      <div id="plannerContent">
        <div class="loading-msg">LOADING EVENTS...</div>
      </div>

      <div class="sysline"><span class="dot"></span><span id="sysId"></span><span class="dot"></span></div>
    </div>
  </div>

  <!-- CHORE WAR -->
  <div class="panel" id="panel-war">
    <div class="app">
      <div class="coming-soon">
        <div class="coming-soon-icon">⚔️</div>
        <div class="coming-soon-title">CHORE WAR</div>
        <div class="coming-soon-sub">COMING SOON — BATTLE YOUR SIBLING FOR POINTS</div>
      </div>
    </div>
  </div>

</div>
</div>

<script>
  // ── Auth guard ────────────────────────────────────────────────
  (function () {
    const u = JSON.parse(sessionStorage.getItem('hok_user') || 'null');
    if (!u || u.role !== 'child') window.location.replace('/planner');
  }());

  const ME = JSON.parse(sessionStorage.getItem('hok_user'));
  if (ME?.color) document.documentElement.style.setProperty('--accent', ME.color);

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Category map ──────────────────────────────────────────────
  const CAT = {
    lunch:          { label: 'LUNCH',    color: 'oklch(0.84 0.16 150)', icon: '🥪' },
    pe:             { label: 'PE KIT',   color: 'oklch(0.82 0.13 220)', icon: '🏃' },
    dad_collection: { label: 'PICKUP',   color: 'oklch(0.82 0.16 45)',  icon: '🚗' },
    dad_weekend:    { label: "DAD'S",    color: 'oklch(0.80 0.14 260)', icon: '🏠' },
    dinner:         { label: 'DINNER',   color: 'oklch(0.85 0.15 78)',  icon: '🍽️' },
    appointment:    { label: 'APPT',     color: 'oklch(0.79 0.18 352)', icon: '🏥' },
    school_event:   { label: 'SCHOOL',   color: 'oklch(0.82 0.16 45)',  icon: '🎒' },
    personal:       { label: 'PERSONAL', color: 'oklch(0.82 0.13 215)', icon: '⭐' },
    family:         { label: 'FAMILY',   color: 'oklch(0.86 0.16 82)',  icon: '🏡' },
    holiday:        { label: 'HOLIDAY',  color: 'oklch(0.68 0.09 200)', icon: '✈️' },
    other:          { label: 'OTHER',    color: 'oklch(0.78 0.16 300)', icon: '📌' },
  };

  const MONTHS   = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const FULLDAY  = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const SHORTDAY = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const DOW_S    = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  // ── State ─────────────────────────────────────────────────────
  let usersMap     = {};
  let allEvents    = [];
  let viewMonday   = weekMonday(new Date());
  let selectedDay  = null;
  let activeProfile = ME.id; // own events by default

  // ── Boot ──────────────────────────────────────────────────────
  async function boot() {
    document.getElementById('tbName').textContent =
      'FAMILY OS // ' + (ME.name || 'PLAYER').toUpperCase();
    document.getElementById('sysId').textContent =
      'SYS.' + (1000 + Math.floor(Math.random() * 9000));
    wireTabs();

    const [{ data: users }, { data, error }] = await Promise.all([
      sb.from('users').select('id, name, color, role'),
      sb.from('events').select('*, event_attendees(user_id)').order('date', { ascending: true }),
    ]);

    if (users) users.forEach(u => { usersMap[u.id] = u; });
    document.getElementById('tbStatus').textContent = error ? 'OFFLINE' : 'LIVE';
    if (!error && data) allEvents = data;

    buildProfilePills();
    renderPlanner();
  }

  // ── Profile pills ─────────────────────────────────────────────
  function buildProfilePills() {
    const container = document.getElementById('profilePills');
    const children  = Object.values(usersMap).filter(u => u.role === 'child');
    const self      = usersMap[ME.id];
    const siblings  = children.filter(u => u.id !== ME.id);
    const ordered   = [self, ...siblings].filter(Boolean);

    const pillsHTML = ordered.map(u => {
      const color  = u.color || 'var(--accent)';
      const isSelf = u.id === ME.id;
      return `<button class="pill${isSelf ? ' on' : ''}" data-uid="${u.id}"
        style="--pc:${color}" onclick="pickProfile('${u.id}')">
        <span class="pill-dot"></span>${isSelf ? 'ME' : esc(u.name).toUpperCase()}
      </button>`;
    }).join('');

    container.innerHTML =
      pillsHTML +
      `<button class="fam-btn" id="famBtn" onclick="pickFamilyProfile()">✦ FAMILY</button>`;
  }

  function pickProfile(uid) {
    activeProfile = uid;
    selectedDay   = null;
    document.querySelectorAll('#profilePills .pill[data-uid]').forEach(p =>
      p.classList.toggle('on', p.dataset.uid === uid)
    );
    document.getElementById('famBtn')?.classList.remove('on');
    renderPlanner();
  }

  function pickFamilyProfile() {
    activeProfile = 'family';
    selectedDay   = null;
    document.querySelectorAll('#profilePills .pill[data-uid]').forEach(p => p.classList.remove('on'));
    document.getElementById('famBtn')?.classList.add('on');
    renderPlanner();
  }

  function filterEvents() {
    if (activeProfile === 'family') return allEvents;
    return allEvents.filter(ev =>
      ev.event_attendees.some(a => a.user_id === activeProfile)
    );
  }

  // ── Tabs ──────────────────────────────────────────────────────
  function wireTabs() {
    document.querySelectorAll('.tab[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab[data-tab]').forEach(t => t.classList.remove('on'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
        btn.classList.add('on');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('on');
      });
    });
  }

  // ── Date helpers ──────────────────────────────────────────────
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function ymd(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }
  function weekMonday(d) {
    const c = new Date(d);
    c.setDate(c.getDate() - ((c.getDay() + 6) % 7));
    c.setHours(0, 0, 0, 0);
    return c;
  }

  // ── Recurrence expansion ──────────────────────────────────────
  function expandToWeek(events, monday) {
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);
    const out = [];

    events.forEach(ev => {
      const evStart = new Date(ev.date + 'T00:00:00');
      const recEnd  = ev.recurrence_end ? new Date(ev.recurrence_end + 'T23:59:59') : null;

      if (!ev.recurrence_type || ev.recurrence_type === 'none') {
        if (ev.event_end_date) {
          const evEnd = new Date(ev.event_end_date + 'T23:59:59');
          const d = new Date(Math.max(evStart.getTime(), monday.getTime()));
          const dEnd = new Date(Math.min(evEnd.getTime(), sunday.getTime()));
          while (d <= dEnd) { out.push({ ...ev, _occ: ymd(d) }); d.setDate(d.getDate() + 1); }
        } else {
          if (evStart >= monday && evStart <= sunday) out.push({ ...ev, _occ: ev.date });
        }
        return;
      }

      const scanEnd = recEnd ? new Date(Math.min(sunday.getTime(), recEnd.getTime())) : sunday;
      const d = new Date(monday);
      while (d <= scanEnd) {
        if (d >= evStart && occursOn(ev, d, evStart)) out.push({ ...ev, _occ: ymd(d) });
        d.setDate(d.getDate() + 1);
      }
    });
    return out;
  }

  function occursOn(ev, d, origin) {
    const dow = DOW_S[(d.getDay() + 6) % 7];
    switch (ev.recurrence_type) {
      case 'daily': return true;
      case 'weekly':
        return !ev.recurrence_days?.length ? d.getDay() === origin.getDay() : ev.recurrence_days.includes(dow);
      case 'biweekly': {
        const wk = Math.floor((d - origin) / 604800000);
        const ok = !ev.recurrence_days?.length ? d.getDay() === origin.getDay() : ev.recurrence_days.includes(dow);
        return ok && wk % 2 === 0;
      }
      case 'monthly': return d.getDate() === origin.getDate();
      default: return false;
    }
  }

  // ── Week nav label ────────────────────────────────────────────
  function weekNavLabel() {
    const diff = Math.round((viewMonday - weekMonday(new Date())) / 604800000);
    if (diff === 0) return 'THIS WEEK';
    if (diff === 1) return 'NEXT WEEK';
    const sun = new Date(viewMonday); sun.setDate(viewMonday.getDate() + 6);
    return viewMonday.getDate() + ' ' + MONTHS[viewMonday.getMonth()] +
      ' — ' + sun.getDate() + ' ' + MONTHS[sun.getMonth()];
  }

  // ── Render ────────────────────────────────────────────────────
  function renderPlanner() {
    const sun = new Date(viewMonday); sun.setDate(sun.getDate() + 6);
    document.getElementById('weekLabel').textContent =
      viewMonday.getDate() + ' ' + MONTHS[viewMonday.getMonth()] + ' — ' +
      sun.getDate() + ' ' + MONTHS[sun.getMonth()] + ' ' + sun.getFullYear();
    document.getElementById('wkThisBtn').textContent = weekNavLabel();

    const isFamily  = activeProfile === 'family';
    const expanded  = expandToWeek(filterEvents(), viewMonday);
    const byDate    = {};
    expanded.forEach(ev => { (byDate[ev._occ] = byDate[ev._occ] || []).push(ev); });

    const tStr = todayStr();
    const days = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(viewMonday); d.setDate(d.getDate() + i); return d;
    });

    const heroDate  = selectedDay
      ? (days.find(d => ymd(d) === selectedDay) || days.find(d => ymd(d) === tStr) || days[0])
      : (days.find(d => ymd(d) === tStr) || days[0]);
    const heroYmd   = ymd(heroDate);
    const isToday   = heroYmd === tStr;
    const heroEvs   = (byDate[heroYmd] || []).slice().sort((a, b) => {
      if (a.all_day && !b.all_day) return 1;
      if (!a.all_day && b.all_day) return -1;
      return (a.start_time || '00:00') < (b.start_time || '00:00') ? -1 : 1;
    });
    const stripDays = days.filter(d => ymd(d) !== heroYmd);

    let html = `
      <div class="hero${isToday ? ' is-today' : ''}">
        <div class="hero-rail">
          <div class="hero-badge">${isToday ? '<span class="pulse-dot"></span>TODAY' : (selectedDay ? 'PREVIEW' : 'UPCOMING')}</div>
          <div class="hero-day">${FULLDAY[heroDate.getDay()]}</div>
          <div class="hero-date">${String(heroDate.getDate()).padStart(2,'0')} ${MONTHS[heroDate.getMonth()]} ${heroDate.getFullYear()}</div>
          <div class="hero-count">
            <span class="hero-count-n">${String(heroEvs.length).padStart(2,'0')}</span>
            <span class="hero-count-l">${heroEvs.length === 1 ? 'EVENT' : 'EVENTS'}<br>ON THE BOARD</span>
          </div>
          ${selectedDay && !isToday ? `<button class="back-btn" onclick="clearDay()">&#8592; BACK TO TODAY</button>` : ''}
        </div>
        <div class="hero-list">
          ${heroEvs.length ? heroEvs.map(ev => evRowHtml(ev, isFamily)).join('') : '<div class="empty">— NOTHING LOGGED FOR THIS DAY —</div>'}
        </div>
      </div>

      <div class="strip-label">
        <span>REST OF THE WEEK</span>
        <span class="strip-rule"></span>
        <span class="strip-hint">TAP TO PREVIEW</span>
      </div>
      <div class="strip">
        ${stripDays.map(d => dayCardHtml(d, byDate[ymd(d)] || [], ymd(d) === tStr, isFamily)).join('')}
      </div>`;

    document.getElementById('plannerContent').innerHTML = html;
  }

  function ownerColor(ev) {
    const uid = ev.event_attendees?.[0]?.user_id;
    return uid ? (usersMap[uid]?.color || 'var(--faint)') : 'var(--faint)';
  }

  function evRowHtml(ev, showOwner) {
    const cat   = CAT[ev.event_type] || { label: (ev.event_type || '').toUpperCase(), color: 'var(--accent)', icon: '📌' };
    const time  = ev.all_day ? 'ALL DAY' : (ev.start_time ? ev.start_time.slice(0, 5) : '—');
    let tagHtml;
    if (showOwner) {
      const uid   = ev.event_attendees?.[0]?.user_id;
      const owner = uid ? usersMap[uid] : null;
      const oc    = owner?.color || 'var(--faint)';
      const name  = owner ? esc(owner.name).toUpperCase() : cat.label;
      tagHtml = `<span class="ev-owner" style="color:${oc}">
        <span class="ev-owner-dot" style="background:${oc}"></span>${name}
      </span>`;
    } else {
      tagHtml = `<span class="ev-tag" style="color:${cat.color}">${cat.label}</span>`;
    }
    return `<div class="ev" style="--cat:${cat.color}">
      <div class="ev-time">${time}</div>
      <div class="ev-ico">${cat.icon}</div>
      <div class="ev-body">
        <div class="ev-titleline">
          <span class="ev-title">${esc(ev.title)}</span>
          ${tagHtml}
        </div>
        ${ev.description ? `<div class="ev-note">${esc(ev.description)}</div>` : ''}
      </div>
    </div>`;
  }

  function dayCardHtml(d, evs, isToday, isFamily) {
    const dow  = SHORTDAY[d.getDay()];
    const dStr = ymd(d);
    const head = `<div class="day-card-head">
      <div class="day-card-day">${dow}${isToday ? ' <span class="today-tick">TODAY</span>' : ''}</div>
      <div class="day-card-date">${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]}</div>
    </div>`;

    let body;
    if (evs.length === 1) {
      const ev  = evs[0];
      const cat = CAT[ev.event_type] || { icon: '📌' };
      const t   = ev.all_day ? '' : (ev.start_time ? ev.start_time.slice(0, 5) : '');
      const oc  = isFamily ? ownerColor(ev) : null;
      body = `<div class="day-card-solo">
        <div class="solo-icon">${cat.icon}</div>
        <div class="solo-title">${esc(ev.title)}</div>
        ${t ? `<div class="solo-time">${t}</div>` : ''}
        ${oc ? `<span class="mini-dot" style="background:${oc}"></span>` : ''}
      </div>`;
    } else {
      const shown = evs.slice(0, 3);
      const extra = evs.length - 3;
      body = `<div class="day-card-list">
        ${shown.length ? shown.map(ev => {
          const cat = CAT[ev.event_type] || { icon: '📌', color: 'var(--accent)' };
          const t   = ev.all_day ? '' : (ev.start_time ? ev.start_time.slice(0, 5) : '');
          const oc  = isFamily ? ownerColor(ev) : null;
          return `<div class="mini-ev" style="--cat:${cat.color}">
            <span class="mini-ico">${cat.icon}</span>
            ${t ? `<span class="mini-time">${t}</span>` : ''}
            <span class="mini-title">${esc(ev.title)}</span>
            ${oc ? `<span class="mini-dot" style="background:${oc}"></span>` : ''}
          </div>`;
        }).join('') : '<div class="mini-empty">— CLEAR —</div>'}
        ${extra > 0 ? `<div class="mini-more">+${extra} MORE</div>` : ''}
      </div>`;
    }

    return `<button class="day-card${isToday ? ' today' : ''}" onclick="selectDay('${dStr}')">
      ${head}${body}
    </button>`;
  }

  function selectDay(d) {
    selectedDay = d;
    renderPlanner();
    document.querySelector('.hero')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function clearDay()    { selectedDay = null; renderPlanner(); }
  function shiftWeek(n)  { viewMonday = new Date(viewMonday); viewMonday.setDate(viewMonday.getDate() + n * 7); selectedDay = null; renderPlanner(); }
  function goThisWeek()  { viewMonday = weekMonday(new Date()); selectedDay = null; renderPlanner(); }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  boot();
</script>
</body>
</html>
