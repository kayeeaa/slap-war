<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House of Kay — Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --pc:#00dcff;--pcs:#00dcffaa;--pc44:#00dcff44;--pc33:#00dcff33;--pc22:#00dcff22;--pc11:#00dcff11;
      --bg:#0d1117;--bg2:#0e1218;--border:#1a2030;
    }
    body{background:var(--bg);height:100vh;font-family:'Share Tech Mono',monospace;color:#ccc;display:flex;flex-direction:column;overflow:hidden;}

    .topbar{background:#080c12;border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .topbar-left{display:flex;align-items:center;gap:10px;}
    .profile-dot{width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 8px var(--pcs);}
    .profile-name{font-size:13px;letter-spacing:0.2em;color:var(--pc);text-shadow:0 0 8px var(--pc44);}
    .topbar-date{font-size:9px;letter-spacing:0.12em;color:#555;}
    .logout-btn{background:none;border:1px solid #2a2a3e;border-radius:4px;color:#555;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.1em;padding:5px 10px;cursor:pointer;}
    .logout-btn:hover{border-color:#444;color:#888;}

    .main{display:flex;flex:1;overflow:hidden;}

    .sidebar{width:110px;background:#080c12;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;flex-shrink:0;}
    .tab-btn{display:block;width:100%;padding:12px 16px;background:none;border:none;border-left:3px solid transparent;font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#555;cursor:pointer;text-align:left;transition:all 0.18s;}
    .tab-btn:hover{color:#888;background:var(--pc11);}
    .tab-btn.active{color:var(--pc);border-left-color:var(--pc);background:var(--pc11);text-shadow:0 0 8px var(--pc44);}
    .tab-icon{display:block;font-size:16px;margin-bottom:4px;}

    .content{flex:1;overflow-y:auto;padding:20px;}
    .panel{display:none;}.panel.active{display:block;}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:12px;}
    .card-label{font-size:8px;letter-spacing:0.2em;color:var(--pc);opacity:0.7;margin-bottom:6px;}
    .card-value{font-size:13px;letter-spacing:0.1em;color:#ddd;}
    .card-value.empty{color:#444;font-size:11px;}
    .card-sub{font-size:10px;letter-spacing:0.08em;color:#666;margin-top:4px;}
    .card.highlight{border-color:var(--pc44);background:var(--pc11);}
    .card.alert{border-color:#ff335544;background:#140808;}
    .card-label.alert-lbl{color:#ff3355;}
    .card.dad-card{border-color:#f0c04044;background:#14110a;}
    .card-label.dad-lbl{color:#f0c040;}

    .section-title{font-size:9px;letter-spacing:0.22em;color:#444;margin-bottom:12px;margin-top:20px;padding-bottom:6px;border-bottom:1px solid var(--border);}
    .section-title:first-child{margin-top:0;}

    .week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
    .day-col{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 8px;}
    .day-col.today{border-color:var(--pc44);background:var(--pc11);}
    .day-col.dad-day{border-color:#f0c04033;background:#0e0d08;}
    .day-name{font-size:8px;letter-spacing:0.2em;color:var(--pc);margin-bottom:8px;text-align:center;}
    .day-date{font-size:9px;color:#555;text-align:center;margin-bottom:10px;}
    .day-item{font-size:9px;letter-spacing:0.06em;color:#777;margin-bottom:5px;padding:4px 6px;background:#0a0d12;border-radius:4px;}
    .day-item .di-lbl{font-size:7px;letter-spacing:0.15em;color:#444;display:block;}
    .day-item.dad-item{background:#0e0d08;color:#f0c04088;}
    .day-item.empty-day{color:#333;}

    .tt-grid{display:grid;grid-template-columns:40px repeat(5,1fr);gap:4px;}
    .tt-head{font-size:8px;letter-spacing:0.15em;color:var(--pc);text-align:center;padding:6px 4px;opacity:0.8;}
    .tt-period{font-size:8px;letter-spacing:0.1em;color:#444;text-align:center;padding:6px 2px;display:flex;align-items:center;justify-content:center;}
    .tt-cell{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:6px 5px;min-height:44px;display:flex;flex-direction:column;justify-content:center;}
    .tt-cell.pe{background:var(--pc11);border-color:var(--pc44);}
    .tt-cell .subj{font-size:9px;letter-spacing:0.06em;color:#ccc;}
    .tt-cell .room{font-size:7px;letter-spacing:0.08em;color:#555;margin-top:2px;}
    .tt-cell.empty{background:#08090c;}

    .meal-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;}
    .meal-day{font-size:8px;letter-spacing:0.18em;color:#555;}
    .meal-name{font-size:12px;letter-spacing:0.1em;color:#ddd;margin-top:4px;}
    .meal-name.empty{color:#333;}
    .meal-name.dad{color:#f0c04088;}
    .ai-note{margin-top:20px;padding:14px;border:1px dashed #2a2a3e;border-radius:8px;text-align:center;}
    .ai-note-text{font-size:9px;letter-spacing:0.14em;color:#444;}
    .ai-note-lbl{font-size:10px;letter-spacing:0.2em;color:#555;margin-bottom:6px;}

    /* FAMILY TAB */
    .family-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
    .family-card-title{font-size:9px;letter-spacing:0.2em;color:var(--pc);opacity:0.7;margin-bottom:14px;}
    .status-chip{display:inline-block;padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:0.15em;margin-bottom:10px;}
    .status-chip.at-dads{background:#f0c04022;border:1px solid #f0c04055;color:#f0c040;}
    .status-chip.at-home{background:var(--pc11);border:1px solid var(--pc44);color:var(--pc);}
    .status-note{font-size:9px;letter-spacing:0.1em;color:#555;margin-bottom:12px;}
    .override-btn{background:none;border:1.5px solid #2a2a3e;border-radius:6px;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:0.12em;color:#666;padding:7px 14px;cursor:pointer;transition:all 0.15s;}
    .override-btn:hover{border-color:#444;color:#888;}

    .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #14161c;}
    .toggle-row:last-child{border-bottom:none;}
    .toggle-label{font-size:11px;letter-spacing:0.1em;color:#aaa;}
    .toggle-sw{width:44px;height:24px;border-radius:12px;background:#141618;border:1.5px solid #2a2a3e;cursor:pointer;position:relative;transition:all 0.2s;flex-shrink:0;}
    .toggle-sw.on{background:var(--pc11);border-color:var(--pc);}
    .toggle-sw::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#444;top:2px;left:2px;transition:all 0.2s;}
    .toggle-sw.on::after{background:var(--pc);left:22px;box-shadow:0 0 6px var(--pcs);}

    .loading{text-align:center;padding:40px;font-size:10px;letter-spacing:0.2em;color:#444;animation:pulse 1.5s infinite;}
    .empty-state{text-align:center;padding:40px 20px;}
    .empty-icon{font-size:32px;margin-bottom:12px;opacity:0.3;}
    .empty-text{font-size:10px;letter-spacing:0.18em;color:#444;line-height:1.8;}

    @keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:#08090c;}
    ::-webkit-scrollbar-thumb{background:var(--pc33);border-radius:2px;}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="profile-dot"></div>
    <div>
      <div class="profile-name" id="topName">...</div>
      <div class="topbar-date" id="topDate">...</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" onclick="logout()">SIGN OUT</button>
  </div>
</div>

<div class="main">
  <nav class="sidebar">
    <button class="tab-btn active" data-panel="day" onclick="switchTab('day')">
      <span class="tab-icon">📅</span>DAY
    </button>
    <button class="tab-btn" data-panel="week" onclick="switchTab('week')">
      <span class="tab-icon">📆</span>WEEK
    </button>
    <button class="tab-btn" data-panel="meals" onclick="switchTab('meals')">
      <span class="tab-icon">🍽</span>MEALS
    </button>
    <button class="tab-btn" data-panel="lessons" onclick="switchTab('lessons')">
      <span class="tab-icon">📚</span>LESSONS
    </button>
    <button class="tab-btn" data-panel="family" onclick="switchTab('family')">
      <span class="tab-icon">🏠</span>FAMILY
    </button>
  </nav>

  <div class="content">
    <div class="panel active" id="panel-day">
      <div class="loading" id="dayLoading">// LOADING...</div>
      <div id="dayContent" style="display:none;"></div>
    </div>
    <div class="panel" id="panel-week">
      <div class="loading" id="weekLoading">// LOADING...</div>
      <div id="weekContent" style="display:none;"></div>
    </div>
    <div class="panel" id="panel-meals">
      <div class="loading" id="mealsLoading">// LOADING...</div>
      <div id="mealsContent" style="display:none;"></div>
    </div>
    <div class="panel" id="panel-lessons">
      <div class="loading" id="lessonsLoading">// LOADING...</div>
      <div id="lessonsContent" style="display:none;"></div>
    </div>
    <div class="panel" id="panel-family">
      <div class="loading" id="familyLoading">// LOADING...</div>
      <div id="familyContent" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const session = requireSession();
  if (!session) throw new Error('no session');

  const isChild = session.name === 'Jenson' || session.name === 'Roux';

  // Apply profile color
  const c = session.color;
  document.head.insertAdjacentHTML('beforeend',
    `<style>:root{--pc:${c};--pcs:${c}aa;--pc44:${c}44;--pc33:${c}33;--pc22:${c}22;--pc11:${c}11;}</style>`);

  document.getElementById('topName').textContent = session.name.toUpperCase();
  const now = new Date();
  document.getElementById('topDate').textContent = now.toLocaleDateString('en-GB', {
    weekday:'long', day:'numeric', month:'long'
  }).toUpperCase();

  function logout() { clearSession(); window.location.replace('/planner/'); }

  // ── DATE HELPERS ──────────────────────────────────────────
  const DAYS = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function todayStr() { return now.toISOString().split('T')[0]; }
  function todayDow() { const d = now.getDay(); return d === 0 ? 7 : d; } // 1=Mon,7=Sun
  function isToday(str) { return str === todayStr(); }
  function isWeekendDay() { return now.getDay() === 0 || now.getDay() === 6; }
  function isTodayWednesday() { return now.getDay() === 3; }

  function getThisMonday() {
    const dow = now.getDay() || 7;
    const mon = new Date(now);
    mon.setDate(now.getDate() - (dow - 1));
    mon.setHours(0,0,0,0);
    return mon;
  }

  function weekRange() {
    const mon = getThisMonday();
    return {
      mon: mon.toISOString().split('T')[0],
      fri: (() => { const f = new Date(mon); f.setDate(mon.getDate()+4); return f.toISOString().split('T')[0]; })(),
      days: Array.from({length:5}, (_,i) => {
        const d = new Date(mon); d.setDate(mon.getDate()+i);
        return { str: d.toISOString().split('T')[0], label: DAYS[d.getDay()], date: d.getDate(), dow: d.getDay() };
      })
    };
  }

  // ── FAMILY CONFIG ─────────────────────────────────────────
  let familyConfig = null;

  function calcKidsAtDads(refSatStr) {
    if (!refSatStr) return false;
    const refSat = new Date(refSatStr + 'T00:00:00');
    const dow = now.getDay();
    const thisSat = new Date(now);
    if (dow === 0) thisSat.setDate(now.getDate()-1);
    else if (dow !== 6) thisSat.setDate(now.getDate()+(6-dow));
    const diffWeeks = Math.round((thisSat - refSat) / 604800000);
    return diffWeeks % 2 === 0;
  }

  function effectiveKidsAtDads(cfg = familyConfig) {
    if (!cfg?.dad_weekend_ref_sat) return false;
    if (cfg.kids_at_dads_override !== null && cfg.kids_at_dads_override !== undefined) {
      const overrideWeek = new Date(cfg.kids_at_dads_override_week + 'T00:00:00');
      if (overrideWeek.getTime() === getThisMonday().getTime()) {
        return cfg.kids_at_dads_override;
      }
    }
    return calcKidsAtDads(cfg.dad_weekend_ref_sat);
  }

  function getLunchDefault(name) {
    return familyConfig?.child_lunch_defaults?.[name] || null;
  }

  function getPeDays(name) {
    return familyConfig?.child_pe_days?.[name] || [];
  }

  function hasPeToday(name, timetableRows) {
    if (timetableRows?.some(l => l.is_pe)) return true;
    const dow = todayDow(); // 1=Mon
    return getPeDays(name).includes(dow);
  }

  // ── TAB SWITCHER ──────────────────────────────────────────
  const loaded = { day:false, week:false, meals:false, lessons:false, family:false };

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.panel === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+name));
    if (!loaded[name]) { loaded[name] = true; ({day:loadDay,week:loadWeek,meals:loadMeals,lessons:loadLessons,family:loadFamily})[name](); }
  }

  function invalidateDayWeekMeals() {
    loaded.day = false; loaded.week = false; loaded.meals = false;
  }

  // ── CARD HELPERS ──────────────────────────────────────────
  function card(label, value, sub, type) {
    // type: '' | 'highlight' | 'alert' | 'dad'
    const cls = ['card', type ? type+'-card' : ''].filter(Boolean).join(' ');
    const lblCls = 'card-label' + (type === 'alert' ? ' alert-lbl' : type === 'dad' ? ' dad-lbl' : '');
    const valCls = 'card-value' + (!value ? ' empty' : '');
    return `<div class="${cls}">
      <div class="${lblCls}">${label}</div>
      <div class="${valCls}">${value || '— NOT SET —'}</div>
      ${sub ? `<div class="card-sub">${sub}</div>` : ''}
    </div>`;
  }

  // ── DAY TAB ───────────────────────────────────────────────
  async function loadDay() {
    const today = todayStr();
    const dow = todayDow();

    const [{ data: plan }, { data: lessons }] = await Promise.all([
      db.from('daily_plans').select('*').eq('profile_id', session.id).eq('plan_date', today).maybeSingle(),
      db.from('timetable').select('*').eq('profile_id', session.id).eq('day_of_week', dow).order('period')
    ]);

    const pe = hasPeToday(session.name, lessons || []);
    const weekend = isWeekendDay();
    const kidsAtDads = effectiveKidsAtDads();
    const wednesday = isTodayWednesday();
    const dadPicksUp = familyConfig?.dad_wednesday_pickup && wednesday;
    const dadFeeds = familyConfig?.dad_wednesday_feeds && wednesday;
    const lunchDefault = getLunchDefault(session.name);

    let html = '';

    // Weekend: kids at dad's
    if (weekend && isChild && kidsAtDads) {
      html += `<div class="section-title">THIS WEEKEND</div>`;
      html += `<div class="card dad-card">
        <div class="card-label dad-lbl">AT DAD'S</div>
        <div class="card-value">You're at Dad's this weekend 🏠</div>
      </div>`;
      html += `<div class="empty-state" style="padding-top:16px;"><div class="empty-text">No plans to show<br>Toggle in FAMILY tab if plans changed</div></div>`;
    } else if (weekend) {
      html += `<div class="section-title">WEEKEND</div>`;
      if (kidsAtDads && !isChild) {
        html += `<div class="card dad-card"><div class="card-label dad-lbl">KIDS' STATUS</div><div class="card-value">Jenson &amp; Roux are at Dad's</div></div>`;
      }
      html += card('DINNER', plan?.dinner, null, '');
      if (plan?.notes) html += card('NOTES', plan.notes, null, '');
    } else {
      // School day
      html += `<div class="section-title">TODAY'S SCHOOL DAY</div>`;

      // Lunch: specific plan overrides default
      const lunch = plan?.school_lunch || lunchDefault;
      html += card('SCHOOL LUNCH', lunch, lunchDefault && !plan?.school_lunch ? 'DEFAULT' : null, '');

      if (dadPicksUp) {
        html += `<div class="card dad-card"><div class="card-label dad-lbl">PICKUP</div><div class="card-value">Dad is collecting from school</div></div>`;
      }

      if (pe) {
        html += `<div class="card highlight"><div class="card-label">PE TODAY</div><div class="card-value">Don't forget your kit! 🏃</div></div>`;
      }

      html += `<div class="section-title">EVENING</div>`;

      if (dadFeeds) {
        html += `<div class="card dad-card"><div class="card-label dad-lbl">DINNER</div><div class="card-value">Dinner with Dad tonight</div><div class="card-sub">Nothing to plan</div></div>`;
      } else {
        html += card('DINNER', plan?.dinner, null, '');
      }

      if (plan?.notes) html += card('NOTES', plan.notes, null, '');

      // Lessons
      if ((lessons || []).length > 0) {
        html += `<div class="section-title">TODAY'S LESSONS</div>`;
        (lessons || []).forEach(l => {
          html += `<div class="card${l.is_pe ? ' highlight' : ''}">
            <div class="card-label">PERIOD ${l.period}${l.is_pe ? ' · PE' : ''}</div>
            <div class="card-value">${l.subject}</div>
            ${l.room || l.teacher ? `<div class="card-sub">${[l.room,l.teacher].filter(Boolean).join(' · ')}</div>` : ''}
          </div>`;
        });
      } else {
        // Show PE from family_config if available
        const peDays = getPeDays(session.name);
        if (peDays.length > 0) {
          html += `<div class="section-title">LESSONS</div>`;
          html += `<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">FULL TIMETABLE NOT SET UP YET<br>ASK KAY TO ADD IT</div></div>`;
        } else {
          html += `<div class="section-title">LESSONS</div>`;
          html += `<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">NO TIMETABLE YET</div></div>`;
        }
      }
    }

    document.getElementById('dayLoading').style.display = 'none';
    document.getElementById('dayContent').innerHTML = html;
    document.getElementById('dayContent').style.display = 'block';
  }

  // ── WEEK TAB ──────────────────────────────────────────────
  async function loadWeek() {
    const { mon, fri, days } = weekRange();
    const { data: plans } = await supabase
      .from('daily_plans').select('*')
      .eq('profile_id', session.id)
      .gte('plan_date', mon).lte('plan_date', fri);

    const byDate = {};
    (plans || []).forEach(p => byDate[p.plan_date] = p);

    const todayS = todayStr();
    const lunchDefault = getLunchDefault(session.name);
    const kidsAtDads = effectiveKidsAtDads();
    const dadFeeds = familyConfig?.dad_wednesday_feeds;

    let html = `<div class="week-grid">`;
    days.forEach(d => {
      const p = byDate[d.str];
      const isTodayCol = d.str === todayS;
      const isWed = d.dow === 3;
      const dadFeedsToday = dadFeeds && isWed;
      const lunch = p?.school_lunch || lunchDefault;

      html += `<div class="day-col${isTodayCol ? ' today' : ''}">
        <div class="day-name">${d.label}</div>
        <div class="day-date">${d.date}</div>`;

      if (lunch) html += `<div class="day-item"><span class="di-lbl">LUNCH</span>${lunch}</div>`;

      if (dadFeedsToday && isChild) {
        html += `<div class="day-item dad-item"><span class="di-lbl">DINNER</span>With Dad</div>`;
      } else if (p?.dinner) {
        html += `<div class="day-item"><span class="di-lbl">DINNER</span>${p.dinner}</div>`;
      }

      if (!lunch && !p?.dinner && !dadFeedsToday) html += `<div class="day-item empty-day">—</div>`;
      html += `</div>`;
    });
    html += `</div>`;

    // Weekend status banner below grid
    if (kidsAtDads && isChild) {
      html += `<div class="card dad-card" style="margin-top:14px;">
        <div class="card-label dad-lbl">THIS WEEKEND</div>
        <div class="card-value">You're at Dad's — toggle in FAMILY tab if plans changed</div>
      </div>`;
    }

    document.getElementById('weekLoading').style.display = 'none';
    document.getElementById('weekContent').innerHTML = html;
    document.getElementById('weekContent').style.display = 'block';
  }

  // ── MEALS TAB ─────────────────────────────────────────────
  async function loadMeals() {
    const { mon, fri, days } = weekRange();
    const { data: plans } = await supabase
      .from('daily_plans').select('plan_date,dinner')
      .eq('profile_id', session.id)
      .gte('plan_date', mon).lte('plan_date', fri);

    const byDate = {};
    (plans || []).forEach(p => byDate[p.plan_date] = p);

    const kidsAtDads = effectiveKidsAtDads();
    const dadFeeds = familyConfig?.dad_wednesday_feeds;

    let html = `<div class="section-title">THIS WEEK'S DINNERS</div>`;
    days.forEach(d => {
      const isWed = d.dow === 3;
      const dadFeedsToday = dadFeeds && isWed && isChild;
      const dinner = byDate[d.str]?.dinner;

      html += `<div class="meal-card">
        <div>
          <div class="meal-day">${d.label} ${d.date}</div>`;

      if (dadFeedsToday) {
        html += `<div class="meal-name dad">Dinner with Dad</div>`;
      } else {
        html += `<div class="meal-name${dinner ? '' : ' empty'}">${dinner || '— NOT PLANNED YET —'}</div>`;
      }
      html += `</div></div>`;
    });

    if (kidsAtDads && isChild) {
      html += `<div class="card dad-card" style="margin-top:4px;">
        <div class="card-label dad-lbl">THIS WEEKEND</div>
        <div class="card-value">At Dad's — no dinner to plan</div>
      </div>`;
    }

    html += `<div class="ai-note">
      <div class="ai-note-lbl">// AI MEAL PLANNING</div>
      <div class="ai-note-text">COMING SOON — AI WILL GENERATE YOUR WEEKLY PLAN BASED ON PREFERENCES AND ALLERGIES</div>
    </div>`;

    document.getElementById('mealsLoading').style.display = 'none';
    document.getElementById('mealsContent').innerHTML = html;
    document.getElementById('mealsContent').style.display = 'block';
  }

  // ── LESSONS TAB ───────────────────────────────────────────
  async function loadLessons() {
    const { data: lessons } = await supabase
      .from('timetable').select('*')
      .eq('profile_id', session.id)
      .in('day_of_week', [1,2,3,4,5])
      .order('day_of_week').order('period');

    const peDays = getPeDays(session.name);

    if (!lessons || lessons.length === 0) {
      let html = `<div class="empty-state"><div class="empty-icon">📚</div>`;
      if (peDays.length > 0) {
        const names = ['MON','TUE','WED','THU','FRI'];
        const peLabels = peDays.map(d => names[d-1]).join(', ');
        html += `<div class="empty-text">FULL TIMETABLE NOT ADDED YET<br><br>PE DAYS: ${peLabels}<br><br>ASK KAY TO ADD THE FULL TIMETABLE</div>`;
      } else {
        html += `<div class="empty-text">NO TIMETABLE SET UP YET<br><br>ASK KAY TO ADD IT</div>`;
      }
      html += `</div>`;
      document.getElementById('lessonsLoading').style.display = 'none';
      document.getElementById('lessonsContent').innerHTML = html;
      document.getElementById('lessonsContent').style.display = 'block';
      return;
    }

    const maxPeriod = Math.max(...lessons.map(l => l.period));
    const bySlot = {};
    lessons.forEach(l => { bySlot[`${l.day_of_week}_${l.period}`] = l; });
    const DAY_LABELS = ['MON','TUE','WED','THU','FRI'];

    let html = `<div class="section-title">WEEKLY TIMETABLE</div><div class="tt-grid">`;
    html += `<div class="tt-head"></div>`;
    DAY_LABELS.forEach(d => html += `<div class="tt-head">${d}</div>`);
    for (let p = 1; p <= maxPeriod; p++) {
      html += `<div class="tt-period">${p}</div>`;
      for (let d = 1; d <= 5; d++) {
        const l = bySlot[`${d}_${p}`];
        if (l) {
          html += `<div class="tt-cell${l.is_pe ? ' pe' : ''}">
            <div class="subj">${l.subject}</div>
            ${l.room ? `<div class="room">${l.room}</div>` : ''}
          </div>`;
        } else {
          html += `<div class="tt-cell empty"></div>`;
        }
      }
    }
    html += `</div>`;

    document.getElementById('lessonsLoading').style.display = 'none';
    document.getElementById('lessonsContent').innerHTML = html;
    document.getElementById('lessonsContent').style.display = 'block';
  }

  // ── FAMILY TAB ────────────────────────────────────────────
  async function loadFamily() {
    renderFamily();
    document.getElementById('familyLoading').style.display = 'none';
    document.getElementById('familyContent').style.display = 'block';
  }

  function renderFamily() {
    const cfg = familyConfig;
    const kidsAtDads = effectiveKidsAtDads();
    const hasConfig = !!cfg?.dad_weekend_ref_sat;
    const isOverrideActive = cfg?.kids_at_dads_override !== null && cfg?.kids_at_dads_override !== undefined &&
      cfg?.kids_at_dads_override_week && new Date(cfg.kids_at_dads_override_week+'T00:00:00').getTime() === getThisMonday().getTime();

    let html = '';

    // Weekend status
    html += `<div class="family-card">
      <div class="family-card-title">THIS WEEKEND</div>`;
    if (!hasConfig) {
      html += `<div class="status-note">No schedule set up yet — Kay needs to complete setup first</div>`;
    } else {
      html += `<div class="status-chip ${kidsAtDads ? 'at-dads' : 'at-home'}">${kidsAtDads ? '🏠 KIDS AT DAD\'S' : '🏡 KIDS HOME'}</div>
        <div class="status-note">${isOverrideActive ? 'Override active for this week' : 'Auto-calculated from alternating schedule'}</div>
        <button class="override-btn" onclick="toggleWeekendOverride()">
          SWITCH TO: ${kidsAtDads ? 'KIDS HOME' : 'KIDS AT DAD\'S'}
        </button>
        ${isOverrideActive ? `<button class="override-btn" style="margin-left:8px;" onclick="clearWeekendOverride()">CLEAR OVERRIDE</button>` : ''}`;
    }
    html += `</div>`;

    // Wednesday toggles
    html += `<div class="family-card">
      <div class="family-card-title">WEDNESDAY ROUTINE</div>
      <div class="toggle-row">
        <span class="toggle-label">Dad picks up from school</span>
        <div class="toggle-sw${cfg?.dad_wednesday_pickup ? ' on' : ''}" id="wedPickupSw" onclick="toggleWed('pickup')"></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">Dad feeding them tonight</span>
        <div class="toggle-sw${cfg?.dad_wednesday_feeds ? ' on' : ''}" id="wedFeedsSw" onclick="toggleWed('feeds')"></div>
      </div>
    </div>`;

    if (!hasConfig) {
      html += `<div class="empty-state"><div class="empty-icon">⚙️</div><div class="empty-text">KAY NEEDS TO COMPLETE HER PROFILE SETUP TO CONFIGURE FAMILY SETTINGS</div></div>`;
    }

    document.getElementById('familyContent').innerHTML = html;
  }

  async function upsertConfig(changes) {
    const cfg = familyConfig || {};
    const updates = { ...changes, updated_at: new Date().toISOString() };
    try {
      if (cfg.id) {
        await db.from('family_config').update(updates).eq('id', cfg.id);
      } else {
        const { data } = await db.from('family_config').insert({
          dad_weekend_ref_sat: '2026-05-02',
          dad_wednesday_pickup: false,
          dad_wednesday_feeds: false,
          child_lunch_defaults: {},
          child_pe_days: {},
          kids_at_dads_override: null,
          kids_at_dads_override_week: null,
          ...updates
        }).select().single();
        familyConfig = data;
        return;
      }
      Object.assign(familyConfig, updates);
    } catch (e) { console.error('Config update failed', e); }
  }

  async function toggleWeekendOverride() {
    const current = effectiveKidsAtDads();
    const monday = getThisMonday().toISOString().split('T')[0];
    await upsertConfig({ kids_at_dads_override: !current, kids_at_dads_override_week: monday });
    renderFamily();
    invalidateDayWeekMeals();
  }

  async function clearWeekendOverride() {
    await upsertConfig({ kids_at_dads_override: null, kids_at_dads_override_week: null });
    renderFamily();
    invalidateDayWeekMeals();
  }

  async function toggleWed(field) {
    const key = field === 'pickup' ? 'dad_wednesday_pickup' : 'dad_wednesday_feeds';
    const newVal = !(familyConfig?.[key] ?? false);
    await upsertConfig({ [key]: newVal });
    renderFamily();
    invalidateDayWeekMeals();
  }

  // ── INIT ──────────────────────────────────────────────────
  async function init() {
    const [{ data: prefs }, { data: cfg }] = await Promise.all([
      db.from('food_preferences').select('id').eq('profile_id', session.id).maybeSingle(),
      db.from('family_config').select('*').limit(1).maybeSingle()
    ]);
    if (!prefs) { window.location.replace('/planner/onboarding/'); return; }
    familyConfig = cfg;
    loadDay();
  }

  init();
</script>
</body>
</html>
