<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>House of Kay — Create Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#0d1117;min-height:100vh;font-family:'Share Tech Mono',monospace;}

    .scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,220,255,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,220,255,0.07) 1px,transparent 1px);background-size:32px 32px;}

    .corner{position:absolute;width:48px;height:48px;}
    .corner svg{width:100%;height:100%;}
    .c-tl{top:18px;left:18px;}.c-tr{top:18px;right:18px;transform:scaleX(-1);}
    .c-bl{bottom:18px;left:18px;transform:scaleY(-1);}.c-br{bottom:18px;right:18px;transform:scale(-1,-1);}

    .phone{width:310px;background:#0a0e14;border:2px solid var(--pc,#00dcff);border-radius:18px;box-shadow:0 0 30px var(--pcs,#00dcff33),inset 0 0 20px #00dcff08;position:relative;z-index:10;overflow:hidden;}
    .phone-top-bar{background:#0d1420;border-bottom:2px solid var(--pcm,#f0c040);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;}
    .back-btn{color:var(--pc,#00dcff);font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:0.1em;cursor:pointer;background:none;border:none;}
    .back-btn:hover{opacity:0.7;}
    .traffic-row{display:flex;gap:6px;}
    .traffic{width:10px;height:10px;border-radius:50%;}
    .phone-body{padding:24px 20px 18px;}

    .profile-badge{text-align:center;margin-bottom:14px;}
    .profile-name{font-size:22px;letter-spacing:0.25em;color:var(--pc,#00dcff);text-shadow:0 0 14px var(--pcs,#00dcff66);}
    .proto-label{text-align:center;font-size:10px;letter-spacing:0.18em;color:var(--pc,#00dcff);margin-bottom:4px;opacity:0.8;}
    .sub-label{text-align:center;font-size:9px;letter-spacing:0.12em;color:var(--pc,#00dcff);opacity:0.5;margin-bottom:18px;}

    .dots-row{display:flex;justify-content:center;gap:10px;margin-bottom:22px;}
    .dot-box{width:38px;height:28px;border:1.5px solid var(--pc44,#00dcff44);border-radius:4px;background:#0d1a22;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
    .dot-box.filled{border-color:var(--pc,#00dcff);background:var(--pc11,#00dcff18);box-shadow:0 0 8px var(--pc44,#00dcff44);}
    .dot-box.filled::after{content:'';width:10px;height:10px;border-radius:2px;background:var(--pc,#00dcff);box-shadow:0 0 6px var(--pcs,#00dcffaa);}

    .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
    .key{height:70px;background:#0a1520;border:1.5px solid var(--pc44,#00dcff55);border-radius:6px;color:var(--pc,#00dcff);font-family:'Share Tech Mono',monospace;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.1s;}
    .key:hover{background:#0d2030;border-color:var(--pc,#00dcff);box-shadow:0 0 10px var(--pc33,#00dcff33);}
    .key:active{transform:scale(0.94);}
    .key.clr{color:#ff3355;border-color:#ff335566;background:#1a0810;font-size:13px;letter-spacing:0.1em;}
    .key.clr:hover{background:#2a0a14;border-color:#ff3355;box-shadow:0 0 10px #ff335533;}
    .bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

    .err-msg{text-align:center;font-size:10px;letter-spacing:0.1em;min-height:16px;margin-top:6px;font-family:'Share Tech Mono',monospace;}
    .sys-id{text-align:center;font-size:9px;color:var(--pc33,#00dcff44);letter-spacing:0.14em;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
    .sys-dot{width:5px;height:5px;border-radius:50%;background:var(--pc66,#00dcff66);animation:blink 2s infinite;}
    .scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(transparent,var(--pc11,#00dcff22),transparent);animation:scanline 3s linear infinite;pointer-events:none;z-index:20;}

    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.2;}}
    @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
    @keyframes scanline{0%{top:-10%;}100%{top:110%;}}
  </style>
</head>
<body>

<div class="scene">
  <div class="grid-bg"></div>
  <div class="corner c-tl" id="ctl"><svg viewBox="0 0 48 48" fill="none"><path d="M2 46 L2 2 L46 2" stroke-width="2.5" stroke-linecap="square"/></svg></div>
  <div class="corner c-tr" id="ctr"><svg viewBox="0 0 48 48" fill="none"><path d="M2 46 L2 2 L46 2" stroke-width="2.5" stroke-linecap="square"/></svg></div>
  <div class="corner c-bl" id="cbl"><svg viewBox="0 0 48 48" fill="none"><path d="M2 46 L2 2 L46 2" stroke-width="2.5" stroke-linecap="square"/></svg></div>
  <div class="corner c-br" id="cbr"><svg viewBox="0 0 48 48" fill="none"><path d="M2 46 L2 2 L46 2" stroke-width="2.5" stroke-linecap="square"/></svg></div>

  <div class="phone" id="phone">
    <div class="scanline"></div>
    <div class="phone-top-bar">
      <button class="back-btn" onclick="window.location.href='/planner/'">← BACK</button>
      <div class="traffic-row">
        <div class="traffic" style="background:#ff5f57;"></div>
        <div class="traffic" style="background:#febc2e;"></div>
        <div class="traffic" style="background:#28c840;"></div>
      </div>
    </div>
    <div class="phone-body">
      <div class="profile-badge">
        <div class="profile-name" id="profileName">...</div>
      </div>
      <div class="proto-label" id="stepLabel">SET YOUR PIN</div>
      <div class="sub-label" id="stepSub">CHOOSE A 4-DIGIT PIN</div>
      <div class="dots-row">
        <div class="dot-box" id="db0"></div>
        <div class="dot-box" id="db1"></div>
        <div class="dot-box" id="db2"></div>
        <div class="dot-box" id="db3"></div>
      </div>
      <div class="pad" id="pad"></div>
      <div class="bottom-row" id="bottomRow"></div>
      <div class="err-msg" id="errMsg"></div>
      <div class="sys-id">FIRST TIME SETUP <span class="sys-dot"></span></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const name      = sessionStorage.getItem('pending_name');
  const color     = sessionStorage.getItem('pending_color')      || '#00dcff';
  const colorName = sessionStorage.getItem('pending_color_name') || 'cyan';

  if (!name) window.location.replace('/planner/');

  // Apply profile color as CSS custom properties
  const root = document.documentElement;
  root.style.setProperty('--pc',   color);
  root.style.setProperty('--pcs',  color + 'aa');
  root.style.setProperty('--pcm',  color + '88');
  root.style.setProperty('--pc44', color + '44');
  root.style.setProperty('--pc33', color + '33');
  root.style.setProperty('--pc11', color + '11');
  root.style.setProperty('--pc66', color + '66');

  document.querySelectorAll('#ctl svg path, #ctr svg path, #cbl svg path, #cbr svg path')
    .forEach(p => p.setAttribute('stroke', color));
  document.getElementById('profileName').textContent = name.toUpperCase();

  let entered = '', firstPin = '', step = 1, shaking = false;

  function buildPad() {
    const pad = document.getElementById('pad');
    pad.innerHTML = '';
    [1,2,3,4,5,6,7,8,9].forEach(n => {
      const k = document.createElement('button');
      k.className = 'key'; k.textContent = n;
      k.onclick = () => addDigit(String(n));
      pad.appendChild(k);
    });
    const bot = document.getElementById('bottomRow');
    bot.innerHTML = '';
    const clr = document.createElement('button');
    clr.className = 'key clr'; clr.textContent = 'CLR';
    clr.onclick = () => { entered = ''; updateDots(); };
    bot.appendChild(clr);
    const zero = document.createElement('button');
    zero.className = 'key'; zero.textContent = '0';
    zero.onclick = () => addDigit('0');
    bot.appendChild(zero);
  }

  function updateDots() {
    for (let i = 0; i < 4; i++)
      document.getElementById('db' + i).classList.toggle('filled', i < entered.length);
  }

  function shake(msg, color) {
    const err = document.getElementById('errMsg');
    err.style.color = color || '#ff3355';
    err.textContent = msg;
    if (!shaking) {
      shaking = true;
      const p = document.getElementById('phone');
      p.style.animation = 'shake 0.4s ease';
      setTimeout(() => { p.style.animation = ''; shaking = false; }, 400);
    }
    entered = ''; updateDots();
  }

  function addDigit(n) {
    if (entered.length >= 4) return;
    entered += n; updateDots();
    if (entered.length === 4) setTimeout(checkPin, 200);
  }

  function checkPin() {
    if (step === 1) {
      firstPin = entered;
      entered = '';
      step = 2;
      document.getElementById('stepLabel').textContent = 'CONFIRM YOUR PIN';
      document.getElementById('stepSub').textContent = 'ENTER IT AGAIN TO CONFIRM';
      document.getElementById('errMsg').textContent = '';
      updateDots();
    } else {
      if (entered !== firstPin) {
        step = 1;
        firstPin = '';
        document.getElementById('stepLabel').textContent = 'SET YOUR PIN';
        document.getElementById('stepSub').textContent = 'PINS DID NOT MATCH — TRY AGAIN';
        shake("// PINS DO NOT MATCH", '#ff3355');
      } else {
        saveProfile(entered);
      }
    }
  }

  async function saveProfile(pin) {
    document.querySelectorAll('.key').forEach(k => k.disabled = true);
    const err = document.getElementById('errMsg');
    err.style.color = 'var(--pc)';
    err.textContent = '// SAVING...';

    try {
      const pinHash = await hashPin(pin);
      const { data, error } = await db
        .from('profiles')
        .insert({ name, color, color_name: colorName, pin_hash: pinHash })
        .select('id,name,color,color_name,pin_hash')
        .single();

      if (error) throw error;

      sessionStorage.removeItem('pending_name');
      sessionStorage.removeItem('pending_color');
      sessionStorage.removeItem('pending_color_name');
      setSession(data);
      window.location.href = '/planner/onboarding/';
    } catch (e) {
      err.style.color = '#ff3355';
      err.textContent = '// SAVE FAILED — ' + (e.message || 'TRY AGAIN');
      document.querySelectorAll('.key').forEach(k => k.disabled = false);
      entered = ''; step = 1; firstPin = '';
      document.getElementById('stepLabel').textContent = 'SET YOUR PIN';
      document.getElementById('stepSub').textContent = 'CHOOSE A 4-DIGIT PIN';
      updateDots();
    }
  }

  buildPad();
</script>
</body>
</html>
