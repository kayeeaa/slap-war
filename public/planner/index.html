<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family OS // Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #08090f;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      font-family: 'Share Tech Mono', monospace;
      padding: 16px;
    }

    /* ── Window ── */
    .window-outer {
      width: min(400px, 100%);
      padding: 2px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00dcff, #44dd88, #ff3d8a, #f0c040);
    }

    .window {
      width: 100%;
      background: #0c0e15;
      border-radius: 10px;
      overflow: hidden;
    }

    /* ── Title bar ── */
    .titlebar {
      background: #090b12;
      border-bottom: 1px solid rgba(0, 220, 255, 0.25);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .traffic-lights { display: flex; gap: 6px; flex-shrink: 0; }

    .tl { width: 11px; height: 11px; border-radius: 50%; }
    .tl.red    { background: #ff5f56; }
    .tl.yellow { background: #ffbd2e; }
    .tl.green  { background: #27c93f; }

    .titlebar-text {
      font-size: 10px;
      letter-spacing: 0.25em;
      color: #2a3a52;
      flex: 1;
      text-align: center;
      padding-right: 34px;
    }

    /* ── Content ── */
    .content {
      padding: 28px 36px 32px;
      text-align: center;
    }

    /* ── Icon ── */
    .icon { margin-bottom: 14px; }

    /* ── Heading ── */
    .heading {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.15em;
      color: #e8eef8;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .subheading {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #2a3a52;
      margin-bottom: 24px;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(0, 220, 255, 0.12);
      margin-bottom: 24px;
    }

    /* ── PIN dots ── */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(0, 220, 255, 0.4);
      transition: background 0.1s, border-color 0.1s, box-shadow 0.1s;
    }

    .pin-dot.filled {
      background: #00dcff;
      border-color: #00dcff;
      box-shadow: 0 0 8px rgba(0, 220, 255, 0.7);
    }

    /* ── Numpad ── */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .num-btn {
      background: #090b12;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 7px;
      padding: 0;
      height: 56px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 20px;
      color: #3a4e66;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.12s, border-color 0.12s, box-shadow 0.12s, transform 0.08s;
    }

    .num-btn:hover {
      color: #00dcff;
      border-color: rgba(0, 220, 255, 0.4);
      box-shadow: 0 0 10px rgba(0, 220, 255, 0.12);
    }

    .num-btn:active {
      transform: scale(0.91);
      color: #00dcff;
      border-color: rgba(0, 220, 255, 0.4);
    }

    .num-btn.action { font-size: 12px; letter-spacing: 0.1em; }

    /* ── Error ── */
    .pin-error {
      font-size: 10px;
      letter-spacing: 0.22em;
      color: #ff4070;
      margin-top: 14px;
      min-height: 16px;
    }

    /* ── Footer ── */
    .footer {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: #161e2c;
      margin-top: 16px;
    }

    /* ── Shake ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-10px); }
      40%     { transform: translateX(10px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* ── Small screens ── */
    @media (max-width: 400px) {
      body { padding: 12px; }
      .content { padding: 20px 20px 24px; }
      .icon { margin-bottom: 10px; }
      .heading { font-size: 17px; }
      .subheading { margin-bottom: 18px; }
      .divider { margin-bottom: 18px; }
      .pin-dots { margin-bottom: 18px; }
      .numpad { gap: 8px; }
      .num-btn { height: 48px; font-size: 18px; }
    }

    @media (max-height: 650px) {
      .icon { display: none; }
      .footer { display: none; }
      .content { padding: 16px 20px 20px; }
      .subheading { margin-bottom: 14px; }
      .divider { margin-bottom: 14px; }
      .pin-dots { margin-bottom: 14px; }
      .num-btn { height: 46px; }
    }
  </style>
</head>
<body>

  <div class="window-outer">
  <div class="window">

    <div class="titlebar">
      <div class="traffic-lights">
        <div class="tl red"></div>
        <div class="tl yellow"></div>
        <div class="tl green"></div>
      </div>
      <div class="titlebar-text">FAMILY OS // PLANNER.EXE</div>
    </div>

    <div class="content">
      <div class="icon">
        <svg width="46" height="46" viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="10" width="36" height="31" rx="4" stroke="#00dcff" stroke-width="1.8"/>
          <line x1="5" y1="19" x2="41" y2="19" stroke="#00dcff" stroke-width="1.8"/>
          <line x1="15" y1="5" x2="15" y2="14" stroke="#00dcff" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="31" y1="5" x2="31" y2="14" stroke="#00dcff" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="16" cy="27" r="2" fill="#00dcff"/>
          <circle cx="23" cy="27" r="2" fill="#00dcff"/>
          <circle cx="30" cy="27" r="2" fill="#00dcff"/>
          <circle cx="16" cy="34" r="2" fill="#00dcff"/>
          <circle cx="23" cy="34" r="2" fill="#00dcff"/>
        </svg>
      </div>

      <div class="heading">HOUSE OF KAY,<br>DANNY, JENSON &amp; ROUX</div>
      <div class="subheading">ENTER YOUR PIN TO CONTINUE</div>

      <hr class="divider" />

      <div class="pin-dots" id="pinDots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>

      <div class="numpad" id="numpad"></div>

      <div class="pin-error" id="pinError"></div>
      <div class="footer" id="sysId"></div>
    </div>

  </div>
  </div>

  <script>
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let pin = '';

    document.getElementById('sysId').textContent =
      'SYS.ID  ' + (1000 + Math.floor(Math.random() * 9000)) + ' •';

    const pad = document.getElementById('numpad');
    ['1','2','3','4','5','6','7','8','9','CLR','0','⌫'].forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'num-btn' + (['CLR','⌫'].includes(k) ? ' action' : '');
      btn.textContent = k;
      btn.addEventListener('click', () => pressKey(k));
      pad.appendChild(btn);
    });

    function pressKey(k) {
      if (k === 'CLR')     { pin = ''; }
      else if (k === '⌫') { pin = pin.slice(0, -1); }
      else if (pin.length < 4) { pin += k; }
      updateDots();
      if (pin.length === 4) checkPin();
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('d' + i).classList.toggle('filled', i < pin.length);
      }
    }

    async function hashPin(p) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPin() {
      const hash = await hashPin(pin);
      const { data } = await sb
        .from('users')
        .select('id, name, color, role')
        .eq('pin_hash', hash)
        .single();

      if (data) {
        sessionStorage.setItem('hok_user', JSON.stringify(data));
        window.location.href = data.role === 'child'
          ? '/planner/dashboard/kids'
          : '/planner/dashboard';
      } else {
        pin = '';
        updateDots();
        document.getElementById('pinError').textContent = 'INCORRECT PIN';
        document.getElementById('pinDots').classList.add('shake');
        setTimeout(() => {
          document.getElementById('pinDots').classList.remove('shake');
          document.getElementById('pinError').textContent = '';
        }, 800);
      }
    }
  </script>
</body>
</html>
