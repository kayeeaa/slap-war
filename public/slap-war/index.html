<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Slap War</title>
  <!-- TODO: move score validation to server-side. Day 1 of saying this. -->
  <link rel="stylesheet" href="/slap-war/style.css" />
  <link rel="stylesheet" href="/slap-war/home.css" />
</head>
<body>

  <!-- ── Start screen ── -->
  <div id="start-screen" class="screen">
    <div class="home-chaos-bg"></div>
    <div class="home-decor">
      <div class="home-rainbow home-rainbow--tl"></div>
      <div class="home-rainbow home-rainbow--tr"></div>
    </div>
    <div class="home-clouds" id="home-clouds"></div>

    <div class="home-stage">
      <div class="home-crown">👑</div>
      <div class="home-title-wrap">
        <h1>SNAP!</h1>
      </div>
      <p class="home-tagline">
        <span>✦</span> the sparkliest matching in all of the land <span>✦</span>
      </p>

      <div class="home-format">
        <span>🎓 30s warm-up - it reads your reactions</span>
        <b>→</b>
        <span>⚡ 30s scored - beat your own ability</span>
        <em>+5 hit · -5 miss · win above 0</em>
      </div>

      <p class="picker-label">Choose your difficulty</p>

      <div class="time-options">
        <button class="btn-primary btn-classic" data-mode="classic" aria-pressed="false">
          <span class="pill-tip">
            <span class="pill-tip-close" aria-label="Close tooltip">×</span>
            <span class="tip-head">🦄 Classic</span>
            <span class="tip-body">Match the numbers. Fixed button, clean reflex snapping.</span>
            <span class="tip-tags"><span>🔢 Numbers</span></span>
          </span>
          <span class="pill-emoji">🦄</span>
          <span class="pill-name">Classic</span>
          <span class="pill-sub">Cute & cozy pace</span>
          <span class="pill-mobile-desc">Match the numbers · fixed button</span>
        </button>
        <button class="btn-primary btn-hard" data-mode="hard" aria-pressed="false">
          <span class="pill-tip">
            <span class="pill-tip-close" aria-label="Close tooltip">×</span>
            <span class="tip-head">💖 Hard</span>
            <span class="tip-body">Snap number matches or colour matches. Two things to watch.</span>
            <span class="tip-tags"><span>🔢 Numbers</span><span>🎨 Colours</span></span>
          </span>
          <span class="pill-emoji">💖</span>
          <span class="pill-name">Hard</span>
          <span class="pill-sub">Quick taps win</span>
          <span class="pill-mobile-desc">Numbers or colours · two things to watch</span>
        </button>
        <button class="btn-primary btn-extreme" data-mode="extreme" aria-pressed="false">
          <span class="pill-tip">
            <span class="pill-tip-close" aria-label="Close tooltip">×</span>
            <span class="tip-head">🌈 Extreme</span>
            <span class="tip-body">Numbers, colours, and a roaming SNAP button. Full sparkle chaos.</span>
            <span class="tip-tags"><span>🔢 Numbers</span><span>🎨 Colours</span><span>🏃 Moving SNAP</span></span>
          </span>
          <span class="pill-emoji">🌈</span>
          <span class="pill-name">Extreme</span>
          <span class="pill-sub">Glitter overload</span>
          <span class="pill-mobile-desc">Numbers, colours + moving SNAP button</span>
        </button>
      </div>

      <button class="home-play" id="home-play-btn" disabled>
        <span class="shine"></span>
        PLAY
        <span class="play-spark">✨</span>
      </button>
    </div>
  </div>

  <!-- ── Result screen ── -->
  <div id="result-screen" class="screen">
    <h1 id="result-heading"></h1>
    <p>You scored <strong id="final-score">0</strong></p>
    <button class="btn-primary" id="play-again-btn">Play Again</button>
  </div>

  <!-- ── Game screen ── -->
  <div id="game-screen" class="screen">

    <div id="header">
      <button id="game-back-btn" aria-label="Back to home">← Home</button>
      <!-- score display only — real value is a closure variable, not the DOM -->
      <div id="score-display">Score: <span id="score">0</span></div>
      <div id="countdown">0:00</div>
    </div>

    <!-- Bot number (top) -->
    <div class="panel">
      <div class="panel-label">TARGET</div>
      <div class="number" id="bot-number">--</div>
    </div>

    <div class="divider"></div>

    <!-- SNAP zone (middle) -->
    <div id="mid-zone">
      <div id="message"></div>
      <button id="snap-btn">SNAP!</button>
    </div>

    <div class="divider"></div>

    <!-- Player number (bottom) -->
    <div class="panel">
      <div class="number" id="player-number">--</div>
      <div class="panel-label">YOUR NUMBER</div>
    </div>

  </div>

  <!-- ── Show-time overlay ── -->
  <div id="showtime-overlay">
    <div id="showtime-inner">
      <div id="showtime-label">SHOW TIME!</div>
    </div>
  </div>

  <script>
  (() => {
    const Game = {
      score: 0,
      botNum: 0,
      playerNum: 0,
      isMatch: false,
      _justSnapped: false,
      _gameStartTime: 0,
      _duration: 0,
      _isExtreme: false,
      _isMoving: false,

      // Learning phase
      _learningDuration: 30000,
      // Number match learning
      _learningSamples: [],
      _learningWindows: 0,
      _matchOpenTime: 0,
      // Colour match learning (hard + extreme)
      _colorLearningSamples: [],
      _colorLearningWindows: 0,
      _colorMatchOpenTime: 0,
      // Accuracy tracking (shared — false snaps aren't match-type-specific)
      _learningMisses: 0,
      // Show time
      _showTimeFired: false,
      _showTimeTimer: null,
      _gamePlanStartTime: 0,
      // Personalised after show time
      _matchWindow: 1000,
      _playerStartFactor: 1.0,
      _colorMatchWindow: 1000,
      _colorPlayerStartFactor: 1.0,

      // Colour match state (extreme only)
      _botColor: '',
      _playerColor: '',
      _isColorMatch: false,
      _colorMatchWindowTimer: null,
      _lastMatchColor: '',
      _lastMatchClosedTime: 0,
      _nextGuaranteedMatchType: 'number',

      // Number timers
      _botTimer: null,
      _playerTimer: null,
      _matchWindowTimer: null,
      _msgTimer: null,
      _greedyTimer: null,

      // Button roaming
      _moveTimer: null,

      // Colour cycle timers
      _botColorTimer: null,
      _playerColorTimer: null,

      // Match guarantee timers
      _firstMatchTimer: null,
      _safetyTimer: null,

      // Game end
      _gameEndTimer: null,
      _countdownTimer: null,

      BOT_MIN: 1500,   BOT_MAX: 2500,
      PLAY_MIN: 1700,  PLAY_MAX: 2800,
      NUDGE_CHANCE: 0.15,
      MOVE_MIN: 1800,  MOVE_MAX: 4500,
      BOT_COLOR_MIN: 2500,  BOT_COLOR_MAX: 6000,
      PLAY_COLOR_MIN: 3000, PLAY_COLOR_MAX: 7000,
      FIRST_MATCH_MIN: 2000, FIRST_MATCH_MAX: 6500,
      SAFETY_WINDOW: 30000,
      MIN_MATCH_GAP: 1200,
      SPEED_MIN_FACTOR: 0.35,

      _colorPalette: [
        '#ff1744',  // red
        '#ff6d00',  // orange
        '#ffd600',  // yellow
        '#00c853',  // green
        '#00e5ff',  // cyan
        '#2979ff',  // blue
        '#d500f9',  // purple
        '#ff4081',  // pink
      ],

      _greedyMessages: [
        "Don't be greedy — already banked! 🤑",
        "Oi! You already got those points! 😏",
        "Cool your jets — that one's already yours!",
        "Once is enough, champ 😄",
        "Points are in the bag, put the button down! 🛑",
      ],

      _successMessages: [
        'SNAP! Great timing! +5',
        'YES! Right on the money! +5',
        'Got it! Quick reflexes! +5',
        'Nailed it! +5',
        'Slap War champion move! +5',
      ],

      _colorSuccessMessages: [
        'COLOUR MATCH! +5',
        'Same shade! +5',
        'Seeing double! +5',
        'Wavelength locked! +5',
        'Spot on! +5',
      ],

      _missWords: ['BOO! 👎', 'MISSED! 💨', 'TOO SLOW! ⚡', 'NOPE! 🙅', 'OOPS! 😬', 'SO CLOSE! 😤'],

      // ── Lifecycle ─────────────────────────────────────────

      start(mode) {
        this._isExtreme = mode !== 'classic'; // colour matching: hard + extreme
        this._isMoving  = mode === 'extreme'; // moving button: extreme only
        this._duration  = 60000;

        this._learningSamples        = [];
        this._learningWindows        = 0;
        this._matchOpenTime          = 0;
        this._colorLearningSamples   = [];
        this._colorLearningWindows   = 0;
        this._colorMatchOpenTime     = 0;
        this._learningMisses         = 0;
        this._showTimeFired          = false;
        this._gamePlanStartTime      = 0;
        this._matchWindow            = 1000;
        this._playerStartFactor      = 1.0;
        this._colorMatchWindow       = 1000;
        this._colorPlayerStartFactor = 1.0;
        this._isColorMatch           = false;
        this._lastMatchColor         = '';
        this._lastMatchClosedTime    = 0;
        this._nextGuaranteedMatchType = 'number';
        this._botColor               = '';
        this._playerColor            = '';

        document.getElementById('start-screen').style.display  = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display   = 'flex';

        this.score = 0;
        this._justSnapped = false;
        this._gameStartTime = Date.now();
        this._updateScore();
        document.getElementById('snap-btn').disabled = false;

        this.botNum = this._randInt(1, 100);
        do { this.playerNum = this._randInt(1, 100); } while (this.playerNum === this.botNum);
        this._setWithPulse('bot-number',    this.botNum);
        this._setWithPulse('player-number', this.playerNum);

        this._scheduleBotChange();
        this._schedulePlayerChange();
        if (this._isMoving) this._startMoving();
        this._startColorCycles();
        this._scheduleFirstMatch();
        this._resetSafetyTimer();
        this._startCountdown();
        this._showTimeTimer = setTimeout(() => this._triggerShowTime(), this._learningDuration);
        this._gameEndTimer  = setTimeout(() => this._endGame(), this._duration);
      },

      goToStart() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display  = '';
      },

      backToHome() {
        this._stopRun();
        document.getElementById('game-screen').style.display   = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display  = '';
      },

      _endGame() {
        this._stopRun();

        const won = this.score > 0;
        const heading = document.getElementById('result-heading');
        heading.textContent = won ? 'YOU WIN!' : 'YOU LOST';
        heading.className   = won ? 'win' : 'lose';

        document.getElementById('final-score').textContent = this.score;

        document.getElementById('game-screen').style.display   = 'none';
        document.getElementById('result-screen').style.display = 'flex';
      },

      _stopRun() {
        clearTimeout(this._botTimer);
        clearTimeout(this._playerTimer);
        clearTimeout(this._matchWindowTimer);
        clearTimeout(this._colorMatchWindowTimer);
        clearTimeout(this._msgTimer);
        clearTimeout(this._greedyTimer);
        clearTimeout(this._firstMatchTimer);
        clearTimeout(this._safetyTimer);
        clearTimeout(this._showTimeTimer);
        clearTimeout(this._gameEndTimer);
        this._stopCountdown();
        this._stopMoving();
        this._stopColorCycles();
        document.getElementById('showtime-overlay').style.display = 'none';

        this.isMatch       = false;
        this._isColorMatch = false;
        this._justSnapped  = false;

        document.getElementById('bot-number').textContent    = '--';
        document.getElementById('player-number').textContent = '--';
        document.getElementById('message').className         = '';
        document.getElementById('snap-btn').disabled         = false;
      },

      // ── Learning → Show Time ──────────────────────────────

      _triggerShowTime() {
        if (this.isMatch) {
          clearTimeout(this._matchWindowTimer);
          this.isMatch = false;
          this._matchOpenTime = 0;
          this._divergeBoth();
          this._scheduleBotChange();
          this._schedulePlayerChange();
          this._resumeMoving();
        }
        if (this._isColorMatch) {
          clearTimeout(this._colorMatchWindowTimer);
          this._isColorMatch = false;
          this._colorMatchOpenTime = 0;
          this._divergeColors();
          this._cycleBotColor();
          this._cyclePlayerColor();
          this._resumeMoving();
        }

        this._buildPlayerProfile();
        this._showTimeFired = true;
        this._gamePlanStartTime = Date.now();
        this.score = 0;
        this._updateScore();

        const overlay = document.getElementById('showtime-overlay');
        overlay.style.display = 'flex';
        setTimeout(() => { overlay.style.display = 'none'; }, 1800);
      },

      _buildPlayerProfile() {
        // ── Shared: false snap rate (0 = never guesses, 1 = all guesses) ──
        const successfulPresses = this._learningSamples.length + this._colorLearningSamples.length;
        const totalPresses  = successfulPresses + this._learningMisses;
        const falseSnapRate = totalPresses > 0
          ? this._learningMisses / totalPresses : 0.2;

        // ── Number match profile ──
        const hits    = this._learningSamples.length;
        const hitRate = this._learningWindows > 0 ? hits / this._learningWindows : 0.5;
        const numberProfile = this._reactionProfile(this._learningSamples, 450, 350);
        const avgRxn  = numberProfile.avg;
        const rxnNorm = Math.max(0, Math.min(1, (avgRxn - 150) / 600));

        // Reaction time consistency: std dev normalised (0 = rock-solid, 1 = very erratic)
        const rxnSd = numberProfile.sdNorm;

        // 0 = elite (tight window, fast start) → 1 = struggling (generous, slower start)
        const difficulty = rxnNorm * 0.35 + (1 - hitRate) * 0.35 + rxnSd * 0.20 + falseSnapRate * 0.10;
        this._matchWindow       = Math.round(480 + difficulty * 570);
        this._playerStartFactor = 0.50 + difficulty * 0.35;

        if (!this._isExtreme) return;

        // ── Colour match profile (separate reaction time + hit rate, shared false snap) ──
        const cHits    = this._colorLearningSamples.length;
        const cHitRate = this._colorLearningWindows > 0 ? cHits / this._colorLearningWindows : 0.5;
        const colorProfile = this._reactionProfile(this._colorLearningSamples, 500, 400);
        const cAvgRxn  = colorProfile.avg;
        const cRxnNorm = Math.max(0, Math.min(1, (cAvgRxn - 150) / 700));

        const cRxnSd = colorProfile.sdNorm;

        const cDifficulty = cRxnNorm * 0.35 + (1 - cHitRate) * 0.35 + cRxnSd * 0.20 + falseSnapRate * 0.10;
        this._colorMatchWindow       = Math.round(500 + cDifficulty * 600);
        this._colorPlayerStartFactor = 0.55 + cDifficulty * 0.35;
      },

      // ── Match guarantees ──────────────────────────────────

      _scheduleFirstMatch() {
        const delay = this._randInt(this.FIRST_MATCH_MIN, this.FIRST_MATCH_MAX);
        this._firstMatchTimer = setTimeout(() => {
          this._forceGuaranteedMatch();
        }, delay);
      },

      _resetSafetyTimer() {
        clearTimeout(this._safetyTimer);
        this._safetyTimer = setTimeout(() => {
          this._forceGuaranteedMatch();
          this._resetSafetyTimer();
        }, this.SAFETY_WINDOW);
      },

      _forceGuaranteedMatch() {
        if (this.isMatch || this._isColorMatch) return;
        if (this._isExtreme && this._nextGuaranteedMatchType === 'color') {
          this._forceColorMatch();
          this._nextGuaranteedMatchType = 'number';
          return;
        }
        this._forceNumberMatch();
        if (this._isExtreme) this._nextGuaranteedMatchType = 'color';
      },

      _forceNumberMatch() {
        clearTimeout(this._botTimer);
        this.botNum = this.playerNum;
        this._setWithPulse('bot-number', this.botNum);
        this._checkMatch(true);
      },

      _forceColorMatch() {
        clearTimeout(this._botColorTimer);
        const matchColor = this._playerColor === this._lastMatchColor
          ? this._pick(this._colorPalette.filter(color => color !== this._lastMatchColor))
          : this._playerColor;
        this._botColor = matchColor;
        this._playerColor = matchColor;
        document.getElementById('bot-number').style.color = matchColor;
        document.getElementById('player-number').style.color = matchColor;
        this._checkColorMatch(true);
      },

      // ── Speed ramps ───────────────────────────────────────

      _speedFactor() {
        if (!this._showTimeFired) return 1.0;
        const t = Math.min(
          (Date.now() - this._gamePlanStartTime) / (this._duration - this._learningDuration), 1
        );
        return this._playerStartFactor - t * (this._playerStartFactor - this.SPEED_MIN_FACTOR);
      },

      _scaledRandInt(min, max) {
        const f = this._speedFactor();
        return this._randInt(Math.round(min * f), Math.round(max * f));
      },

      _colorSpeedFactor() {
        if (!this._showTimeFired) return 1.0;
        const t = Math.min(
          (Date.now() - this._gamePlanStartTime) / (this._duration - this._learningDuration), 1
        );
        return this._colorPlayerStartFactor - t * (this._colorPlayerStartFactor - this.SPEED_MIN_FACTOR);
      },

      _scaledColorRandInt(min, max) {
        const f = this._colorSpeedFactor();
        return this._randInt(Math.round(min * f), Math.round(max * f));
      },

      // ── Countdown ─────────────────────────────────────────

      _startCountdown() {
        const tick = () => {
          const remaining = Math.max(0, this._duration - (Date.now() - this._gameStartTime));
          const totalSecs = Math.ceil(remaining / 1000);
          const m = Math.floor(totalSecs / 60);
          const s = totalSecs % 60;
          document.getElementById('countdown').textContent = m + ':' + String(s).padStart(2, '0');
          if (remaining > 0) this._countdownTimer = setTimeout(tick, 200);
        };
        tick();
      },

      _stopCountdown() {
        clearTimeout(this._countdownTimer);
      },

      // ── Independent number timers ─────────────────────────

      _scheduleBotChange() {
        this._botTimer = setTimeout(() => {
          const nudge = this._showTimeFired ? this.NUDGE_CHANCE : 0.25;
          this.botNum = Math.random() < nudge ? this.playerNum : this._randInt(1, 100);
          this._setWithPulse('bot-number', this.botNum);
          this._checkMatch();
          if (!this.isMatch) this._scheduleBotChange();
        }, this._scaledRandInt(this.BOT_MIN, this.BOT_MAX));
      },

      _schedulePlayerChange() {
        this._playerTimer = setTimeout(() => {
          this.playerNum = this._randInt(1, 100);
          this._setWithPulse('player-number', this.playerNum);
          this._checkMatch();
          if (!this.isMatch) this._schedulePlayerChange();
        }, this._scaledRandInt(this.PLAY_MIN, this.PLAY_MAX));
      },

      // ── Number match detection ────────────────────────────

      _checkMatch(isGuaranteed = false) {
        if (this.botNum !== this.playerNum) return;
        if (this.isMatch || this._isColorMatch) return; // one active match at a time
        if (!isGuaranteed && !this._canOpenMatch()) return;
        clearTimeout(this._botTimer);
        clearTimeout(this._playerTimer);
        clearTimeout(this._firstMatchTimer);
        this._resetSafetyTimer();
        this.isMatch = true;
        this._matchOpenTime = Date.now();
        if (!this._showTimeFired) this._learningWindows++;
        this._pauseMoving();

        // In extreme, ensure colours differ visually during a number match
        if (this._isExtreme && this._botColor === this._playerColor) {
          this._divergeColors();
        }

        this._matchWindowTimer = setTimeout(() => {
          this.isMatch = false;
          this._matchOpenTime = 0;
          this._markMatchClosed();
          this._recordMiss('Too slow! Number match missed -5', true);
          this._divergeBoth();
          this._scheduleBotChange();
          this._schedulePlayerChange();
          this._resumeMoving();
        }, this._matchWindow);
      },

      // ── Colour match detection (extreme only) ─────────────

      _checkColorMatch(isGuaranteed = false) {
        if (!this._isExtreme) return false;
        if (this._botColor !== this._playerColor) return false;
        if (this.isMatch || this._isColorMatch) return false; // one active match at a time
        if (!isGuaranteed && !this._canOpenMatch()) return false;
        // Block the same colour matching twice in a row
        if (this._botColor === this._lastMatchColor) {
          this._divergeColors();
          return false;
        }

        clearTimeout(this._botColorTimer);
        clearTimeout(this._playerColorTimer);
        this._isColorMatch = true;
        this._colorMatchOpenTime = Date.now();
        if (!this._showTimeFired) this._colorLearningWindows++;
        this._resetSafetyTimer();
        this._pauseMoving();

        this._colorMatchWindowTimer = setTimeout(() => {
          this._isColorMatch = false;
          this._colorMatchOpenTime = 0;
          this._markMatchClosed();
          this._recordMiss('Too slow! Colour match missed -5', true);
          this._divergeColors();
          this._cycleBotColor();
          this._cyclePlayerColor();
          this._resumeMoving();
        }, this._colorMatchWindow);

        return true;
      },

      // ── Player action ─────────────────────────────────────

      handleSnap() {
        if (this._justSnapped) {
          this.showMessage(this._pick(this._greedyMessages), 'fail');
          return;
        }

        if (this.isMatch) {
          if (!this._showTimeFired && this._matchOpenTime > 0) {
            this._learningSamples.push(Date.now() - this._matchOpenTime);
          }
          this._matchOpenTime = 0;
          this.isMatch = false;
          clearTimeout(this._matchWindowTimer);
          this._markMatchClosed();
          this.score += 5;
          this._updateScore();
          this.showMessage(this._pick(this._successMessages), 'success');
          this._glowNumbers();
          this._divergeBoth();

          this._justSnapped = true;
          clearTimeout(this._greedyTimer);
          this._greedyTimer = setTimeout(() => { this._justSnapped = false; }, this._matchWindow);

          this._scheduleBotChange();
          this._schedulePlayerChange();
          this._resumeMoving();

        } else if (this._isColorMatch) {
          if (!this._showTimeFired && this._colorMatchOpenTime > 0) {
            this._colorLearningSamples.push(Date.now() - this._colorMatchOpenTime);
          }
          this._colorMatchOpenTime = 0;
          this._isColorMatch = false;
          clearTimeout(this._colorMatchWindowTimer);
          this._lastMatchColor = this._botColor; // prevent same colour repeating next time
          this._markMatchClosed();
          this.score += 5;
          this._updateScore();
          this.showMessage(this._pick(this._colorSuccessMessages), 'success');
          this._glowNumbers();
          this._divergeColors();

          this._justSnapped = true;
          clearTimeout(this._greedyTimer);
          this._greedyTimer = setTimeout(() => { this._justSnapped = false; }, this._colorMatchWindow);

          this._cycleBotColor();
          this._cyclePlayerColor();
          this._resumeMoving();

        } else {
          this._recordMiss('Missed! -5');
        }
      },

      // ── Button roaming ────────────────────────────────────

      _startMoving() {
        const btn = document.getElementById('snap-btn');
        const rect = btn.getBoundingClientRect();
        btn.style.left = rect.left + 'px';
        btn.style.top  = rect.top  + 'px';
        btn.classList.add('roaming');
        setTimeout(() => this._placeSnapBtn(), 50);
      },

      _placeSnapBtn() {
        const btn         = document.getElementById('snap-btn');
        const topPanel    = document.getElementById('bot-number').closest('.panel');
        const bottomPanel = document.getElementById('player-number').closest('.panel');
        const w   = btn.offsetWidth  || 200;
        const h   = btn.offsetHeight || 72;
        const pad = 14;
        const safeTop    = topPanel.getBoundingClientRect().bottom + pad;
        const safeBottom = bottomPanel.getBoundingClientRect().top - h - pad;
        const maxX       = window.innerWidth - w - pad;
        btn.style.left = this._randInt(pad, Math.max(pad, maxX)) + 'px';
        btn.style.top  = this._randInt(safeTop, Math.max(safeTop, safeBottom)) + 'px';
        this._moveTimer = setTimeout(() => this._placeSnapBtn(), this._scaledRandInt(this.MOVE_MIN, this.MOVE_MAX));
      },

      _stopMoving() {
        clearTimeout(this._moveTimer);
        const btn = document.getElementById('snap-btn');
        btn.classList.remove('roaming');
        btn.style.left = '';
        btn.style.top  = '';
      },

      _pauseMoving() {
        if (this._isMoving) clearTimeout(this._moveTimer);
      },

      _resumeMoving() {
        if (!this._isMoving) return;
        clearTimeout(this._moveTimer);
        this._moveTimer = setTimeout(() => this._placeSnapBtn(), this._scaledRandInt(this.MOVE_MIN, this.MOVE_MAX));
      },

      // ── Colour cycles ─────────────────────────────────────

      _startColorCycles() {
        this._cycleBotColor();
        this._cyclePlayerColor();
      },

      _cycleBotColor() {
        // Pick a colour different from current; in extreme also avoid a repeat colour match
        let newColor;
        do {
          newColor = this._pick(this._colorPalette);
        } while (
          newColor === this._botColor ||
          (this._isExtreme && newColor === this._playerColor && newColor === this._lastMatchColor)
        );
        this._botColor = newColor;
        document.getElementById('bot-number').style.color = newColor;
        // If a colour match opened, _checkColorMatch clears both timers — return without rescheduling
        if (this._isExtreme && this._checkColorMatch()) return;
        const delay = this._isExtreme
          ? this._scaledColorRandInt(this.BOT_COLOR_MIN, this.BOT_COLOR_MAX)
          : this._randInt(this.BOT_COLOR_MIN, this.BOT_COLOR_MAX);
        this._botColorTimer = setTimeout(() => this._cycleBotColor(), delay);
      },

      _cyclePlayerColor() {
        let newColor;
        do {
          newColor = this._pick(this._colorPalette);
        } while (
          newColor === this._playerColor ||
          (this._isExtreme && newColor === this._botColor && newColor === this._lastMatchColor)
        );
        this._playerColor = newColor;
        document.getElementById('player-number').style.color = newColor;
        if (this._isExtreme && this._checkColorMatch()) return;
        const delay = this._isExtreme
          ? this._scaledColorRandInt(this.PLAY_COLOR_MIN, this.PLAY_COLOR_MAX)
          : this._randInt(this.PLAY_COLOR_MIN, this.PLAY_COLOR_MAX);
        this._playerColorTimer = setTimeout(() => this._cyclePlayerColor(), delay);
      },

      _stopColorCycles() {
        clearTimeout(this._botColorTimer);
        clearTimeout(this._playerColorTimer);
        document.getElementById('bot-number').style.color    = '';
        document.getElementById('player-number').style.color = '';
        this._botColor = '';
        this._playerColor = '';
      },

      // ── Colour diverge ────────────────────────────────────

      _divergeColors() {
        let newColor;
        do {
          newColor = this._pick(this._colorPalette);
        } while (newColor === this._botColor || newColor === this._playerColor);
        this._playerColor = newColor;
        document.getElementById('player-number').style.color = newColor;
      },

      // ── Helpers ───────────────────────────────────────────

      showMessage(text, type) {
        const el = document.getElementById('message');
        clearTimeout(this._msgTimer);
        el.textContent = text;
        el.className = 'show ' + type;
        this._msgTimer = setTimeout(() => { el.className = ''; }, 1100);
      },

      _showMissPop() {
        const btn  = document.getElementById('snap-btn');
        const rect = btn.getBoundingClientRect();
        const el   = document.createElement('div');
        el.className   = 'miss-pop';
        el.textContent = this._pick(this._missWords);
        el.style.left  = (rect.left + rect.width / 2) + 'px';
        el.style.top   = rect.top + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      },

      _updateScore() {
        document.getElementById('score').textContent = this._showTimeFired ? this.score : '--';
      },

      _recordMiss(message, alwaysUseMessage = false) {
        if (!this._showTimeFired) this._learningMisses++;
        this._showMissPop();
        this.score -= 5;
        this._updateScore();
        this.showMessage(!alwaysUseMessage && this._showTimeFired && this.score < 0 ? 'In the red! -5 ⚠️' : message, 'fail');
      },

      _setWithPulse(id, value) {
        const el = document.getElementById(id);
        el.textContent = value;
        el.classList.remove('pulse', 'glow');
        void el.offsetWidth;
        el.classList.add('pulse');
      },

      _glowNumbers() {
        ['bot-number', 'player-number'].forEach(id => {
          const el = document.getElementById(id);
          el.classList.add('glow');
          setTimeout(() => el.classList.remove('glow'), 600);
        });
      },

      _canOpenMatch() {
        return Date.now() - this._lastMatchClosedTime >= this.MIN_MATCH_GAP;
      },

      _markMatchClosed() {
        this._lastMatchClosedTime = Date.now();
      },

      _reactionProfile(samples, fallbackAvg, sdScale) {
        if (!samples.length) return { avg: fallbackAvg, sdNorm: 0.5 };
        const sorted = [...samples].sort((a, b) => a - b);
        const trim = sorted.length >= 5 ? Math.floor(sorted.length * 0.15) : 0;
        const usable = sorted.slice(trim, sorted.length - trim || sorted.length);
        const avg = usable.reduce((a, b) => a + b, 0) / usable.length;
        if (usable.length < 3) return { avg, sdNorm: 0.5 };
        const sd = Math.sqrt(usable.reduce((s, t) => s + (t - avg) ** 2, 0) / usable.length);
        return { avg, sdNorm: Math.min(1, sd / sdScale) };
      },

      _divergeBoth() {
        this.botNum = this._randInt(1, 100);
        this._setWithPulse('bot-number', this.botNum);
        do { this.playerNum = this._randInt(1, 100); } while (this.playerNum === this.botNum);
        this._setWithPulse('player-number', this.playerNum);
      },

      _pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      },

      _randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      },
    };

    let selectedMode = '';

    function bindControls() {
      const startScreen = document.getElementById('start-screen');
      const modeButtons = document.querySelectorAll('[data-mode]');

      function selectMode(mode) {
        selectedMode = mode;
        startScreen.classList.toggle('mode-hard', mode === 'hard');
        startScreen.classList.toggle('mode-extreme', mode === 'extreme');
        modeButtons.forEach(button => {
          const isSelected = button.dataset.mode === mode;
          button.classList.toggle('selected', isSelected);
          button.setAttribute('aria-pressed', String(isSelected));
        });
        document.getElementById('home-play-btn').disabled = !selectedMode;
      }

      document.querySelectorAll('[data-mode]').forEach(button => {
        button.addEventListener('click', () => selectMode(button.dataset.mode));
      });

      document.querySelectorAll('.pill-tip-close').forEach(closeBtn => {
        closeBtn.addEventListener('click', e => {
          e.stopPropagation();
          closeBtn.closest('.btn-primary').blur();
        });
      });

      document.getElementById('home-play-btn').addEventListener('click', () => {
        if (selectedMode) Game.start(selectedMode);
      });
      document.getElementById('game-back-btn').addEventListener('click', () => Game.backToHome());
      document.getElementById('play-again-btn').addEventListener('click', () => Game.goToStart());
      document.getElementById('snap-btn').addEventListener('click', () => Game.handleSnap());

      document.addEventListener('keydown', e => {
        if (e.repeat || (e.key !== ' ' && e.key !== 'Enter')) return;
        e.preventDefault();

        if (document.getElementById('game-screen').style.display === 'flex') {
          Game.handleSnap();
        } else if (document.getElementById('result-screen').style.display !== 'none') {
          Game.goToStart();
        } else if (selectedMode) {
          Game.start(selectedMode);
        }
      });
    }

    function installFriendlyTripwires() {

      // ── window.Game proxy ────────────────────────────────
      const wave = [
        'Nice try. The obvious Game object has left the building.',
        'Achievement unlocked: tried window.Game first.',
        'Warmer, but this door is decorative.',
        'You have now asked four times. We respect the persistence.',
      ];
      let peeks = 0;

      Object.defineProperty(window, 'Game', {
        configurable: true,
        get() {
          console.info('%c' + wave[Math.min(peeks++, wave.length - 1)], 'color:#ff4db8;font-weight:900');
          return new Proxy({}, {
            get(_target, prop) {
              console.info(`Game.${String(prop)}? Bold. Incorrect, but bold.`);
              return () => console.info('No points for that route. Try harder, security wizard.');
            },
            set(_target, prop, value) {
              console.info(`Attempted Game.${String(prop)} = ${JSON.stringify(value)}. Cute. Score remains emotionally unchanged.`);
              return true;
            },
          });
        },
        set() {
          console.info('You brought your own Game object? Adorable. Rejected with affection.');
        },
      });

      // ── Common cheat property traps ──────────────────────
      const naiveTrap = {
        score:      'The score display is a label. The real score is a closure variable. You are yelling at a window sticker.',
        win:        'window.win = true would be elegant. Unfortunately, no.',
        cheat:      'window.cheat isn\'t wired up. window.cheatCode() is though. You\'re welcome.',
        hack:       'Naming a variable "hack" in the console. Respect the commitment.',
        godMode:    'God mode: spiritually unlocked. Practically ineffective. You feel powerful but nothing happened.',
        debugMode:  'Debug mode is now true. Observation: you can already see everything. Congratulations on confirming that.',
        _score:     'Getting warmer. Still wrong. The closure is laughing with you, not at you.',
        _s:         'Thought we\'d use a single-letter secret? We thought about it and decided against it.',
        flag:       'No flag here. window.cheatCode() though — that one is real.',
        admin:      'window.admin? We are not a 2003 PHP login form.',
        isMatch:    'isMatch lives in a closure. You are talking to its shadow on the wall.',
        _endGame:   'Ooh. Now you are thinking about the right layer. Wrong surface, good instinct.',
        speedHack:  'Already watching for timer acceleration. Thoughtful of you to announce the plan.',
        bypass:     'No bypass property. There is a debugger panel, though. Just saying.',
        override:   'Overriding window.override. The audacity is appreciated.',
        secretCode: 'Not here. Have you tried window.cheatCode()?',
        help:       'Try window.helpMe() — it is embarrassingly honest.',
      };

      for (const [name, message] of Object.entries(naiveTrap)) {
        let hits = 0;
        try {
          Object.defineProperty(window, name, {
            configurable: false,
            enumerable:   false,
            get() {
              if (hits === 0) console.info('%c🔒 ' + message, 'color:#ff9800;font-weight:700');
              else console.info('%c🔒 window.' + name + ' again. Tenacious.', 'color:#ff9800');
              hits++;
              return undefined;
            },
            set(v) {
              console.info('%c🔒 window.' + name + ' = ' + JSON.stringify(v) + ': warmly and completely declined.', 'color:#ff9800;font-style:italic');
            },
          });
        } catch (_) { /* already non-configurable, skip */ }
      }

      // ── Help easter egg (actually tells you how) ─────────
      window.helpMe = () => {
        console.group('%c🆘 Slap War Penetration Guide (Official, Genuine, Freely Given)', 'color:#9c27b0;font-weight:900;font-size:14px');
        console.info('The game runs inside an IIFE. window.Game is a decoy.');
        console.info('Step 1: Sources panel → find the inline <script> → set a breakpoint inside handleSnap or _endGame');
        console.info('Step 2: Trigger a snap in-game to hit the breakpoint');
        console.info('Step 3: In the Scope panel you will see the real closure — isMatch, score, _justSnapped, all of it');
        console.info('Step 4: Edit them directly. That is the move. We can\'t stop you at that layer.');
        console.info('Step 5: You didn\'t need my help. This is just Kay being smug about knowing how.');
        console.groupEnd();
        return 'Good luck. Genuinely. — Kay 💖';
      };

      // ── Score DOM integrity watch ────────────────────────
      const scoreEl = document.getElementById('score');
      if (scoreEl) {
        const domWatch = new MutationObserver(() => {
          const shown    = scoreEl.textContent;
          const expected = Game._showTimeFired ? String(Game.score) : '--';
          if (shown !== expected) {
            domWatch.disconnect();
            console.info('%c👀 DOM tampering detected on score element. Cute trick.', 'color:#e91e63;font-weight:900');
            scoreEl.textContent = '🚩';
            setTimeout(() => {
              scoreEl.textContent = Game._showTimeFired ? String(Game.score) : '--';
              domWatch.observe(scoreEl, { childList: true, characterData: true, subtree: true });
            }, 1100);
          }
        });
        domWatch.observe(scoreEl, { childList: true, characterData: true, subtree: true });
      }

      // ── Timer speed-hack detection ───────────────────────
      const _t0 = Date.now();
      let _ticks = 0;
      const _speedInterval = setInterval(() => {
        _ticks++;
        if (Date.now() - _t0 < _ticks * 800 * 0.55) {
          console.warn('%c⚡ Timer acceleration detected. Slap War says: slow down, it\'s a matching game, not a heist.', 'color:#ff1744;font-weight:900');
          clearInterval(_speedInterval);
        }
      }, 800);

      // ── Fetch trap (there is no server) ─────────────────
      const _realFetch = window.fetch?.bind(window);
      window.fetch = (...args) => {
        if (/score|cheat|win|hack|flag/i.test(String(args[0] ?? ''))) {
          console.info('%c🌐 Tried to phone a server? There is no server. This game is a glass box with a pink bow on it.', 'color:#00bcd4;font-weight:700');
          return Promise.reject(new Error('No backend. You are phoning an empty room.'));
        }
        return _realFetch ? _realFetch(...args) : Promise.reject(new Error('fetch unavailable'));
      };

      // ── Cheat code + banner ──────────────────────────────
      window.cheatCode = () => {
        console.info('Cheat code accepted: drink water, stretch your wrists, continue investigation.');
        return 'FLAG{client_side_games_are_not_security_boundaries}';
      };

      console.info('%cSlap War — client-side games are made of glass. Have fun finding the cracks.', 'color:#00e5ff;font-weight:900');
      console.info('%cTip: window.helpMe() if you want a nudge.', 'color:#9c27b0');
    }

    // ── Sparkle particles on start screen ─────────────────
    (function spawnSparkles() {
      const screen  = document.getElementById('start-screen');
      const symbols = ['✨','💖','🌸','💎','🦄','⭐','💫','🎀','🍭','💜','🌟','🩷','🪄','🍬','🫧'];
      for (let i = 0; i < 16; i++) {
        const el = document.createElement('span');
        el.className   = 'sparkle';
        el.textContent = symbols[i % symbols.length];
        el.style.left              = (2 + Math.random() * 94) + '%';
        el.style.top               = (5 + Math.random() * 88) + '%';
        el.style.fontSize          = (14 + Math.random() * 28) + 'px';
        const dur = 1.8 + Math.random() * 2.6;
        const delay = Math.random() * 4;
        el.style.animationDuration = dur + 's';
        el.style.animationDelay    = delay + 's';
        screen.appendChild(el);
      }
    })();

    // ── Ground clouds ──────────────────────────────────────
    (function spawnClouds() {
      const container = document.getElementById('home-clouds');
      if (!container) return;
      let html = '';
      const blobs = 14;
      for (let i = 0; i < blobs; i++) {
        const w = 120 + Math.random() * 260;
        const x = (i / blobs) * 100 + (Math.random() * 6 - 3);
        const lift = Math.random() * 7;
        html += `<div class="home-cloud" style="width:${w}px;height:${w}px;left:${x}vw;bottom:${-8 + lift}vh"></div>`;
      }
      container.innerHTML = html;
    })();
    bindControls();
    installFriendlyTripwires();
  })();
