<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Slap War</title>
  <link rel="stylesheet" href="/slap-war/style.css" />
</head>
<body>

  <!-- ── Start screen ── -->
  <div id="start-screen" class="screen">
    <h1>SNAP</h1>
    <p>Select your game time</p>
    <div class="time-options">
      <button class="btn-primary" onclick="Game.start(60)">1 MIN</button>
      <button class="btn-primary" onclick="Game.start(120)">2 MIN</button>
    </div>
  </div>

  <!-- ── Result screen ── -->
  <div id="result-screen" class="screen" style="display:none">
    <h1 id="result-heading"></h1>
    <p>You scored <strong id="final-score">0</strong></p>
    <p id="best-score-msg">Best: <strong id="best-score">0</strong> pts</p>
    <button class="btn-primary" onclick="Game.goToStart()">Play Again</button>
  </div>

  <!-- ── Game screen ── -->
  <div id="game-screen" class="screen">

    <div id="header">
      <div id="score-display">Score: <span id="score">0</span></div>
      <div id="countdown">0:00</div>
    </div>

    <!-- Bot number (top) -->
    <div class="panel">
      <div class="panel-label">TARGET</div>
      <div class="number" id="bot-number">--</div>
    </div>

    <div class="divider"></div>

    <!-- SNAP zone (middle) -->
    <div id="mid-zone">
      <div id="message"></div>
      <button id="snap-btn" onclick="Game.handleSnap()">SNAP!</button>
    </div>

    <div class="divider"></div>

    <!-- Player number (bottom) -->
    <div class="panel">
      <div class="number" id="player-number">--</div>
      <div class="panel-label">YOUR NUMBER</div>
    </div>

  </div>

  <script>
    const Game = {
      score: 0,
      botNum: 0,
      playerNum: 0,
      isMatch: false,
      _justSnapped: false,
      _peakScore: 0,
      _gameStartTime: 0,
      _duration: 0,

      // Number timers
      _botTimer: null,
      _playerTimer: null,
      _matchWindowTimer: null,
      _msgTimer: null,
      _greedyTimer: null,

      // Button roaming
      _moveTimer: null,

      // Number colour cycles
      _botColorTimer: null,
      _playerColorTimer: null,

      // Match guarantee timers
      _firstMatchTimer: null,
      _safetyTimer: null,

      // Game end
      _gameEndTimer: null,
      _countdownTimer: null,

      BOT_MIN: 1500,   BOT_MAX: 2500,
      PLAY_MIN: 1700,  PLAY_MAX: 2800,
      MATCH_WINDOW: 800,
      NUDGE_CHANCE: 0.15,
      MOVE_MIN: 1800,  MOVE_MAX: 4500,
      BOT_COLOR_MIN: 2500,  BOT_COLOR_MAX: 6000,
      PLAY_COLOR_MIN: 3000, PLAY_COLOR_MAX: 7000,
      FIRST_MATCH_MIN: 2000, FIRST_MATCH_MAX: 6500,
      SAFETY_WINDOW: 30000,
      SPEED_MIN_FACTOR: 0.35,

      // Vibrant palette — all readable on dark background
      _colorPalette: [
        '#4a90d9', '#9c6bef', '#26c6da', '#ff7043',
        '#ec407a', '#66bb6a', '#ffa726', '#26a69a',
        '#ef5350', '#ab47bc',
      ],

      _greedyMessages: [
        "Don't be greedy — already banked! 🤑",
        "Oi! You already got those points! 😏",
        "Cool your jets — that one's already yours!",
        "Once is enough, champ 😄",
        "Points are in the bag, put the button down! 🛑",
      ],

      _successMessages: [
        'SNAP! Great timing! +5',
        'YES! Right on the money! +5',
        'Got it! Quick reflexes! +5',
        'Nailed it! +5',
        'Slap War champion move! +5',
      ],

      _missWords: ['BOO! 👎', 'MISSED! 💨', 'TOO SLOW! ⚡', 'NOPE! 🙅', 'OOPS! 😬', 'SO CLOSE! 😤'],

      // ── Lifecycle ─────────────────────────────────────────

      start(durationSeconds) {
        this._duration = durationSeconds * 1000;

        document.getElementById('start-screen').style.display  = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('game-screen').style.display   = 'flex';

        this.score = 0;
        this._peakScore = 0;
        this._justSnapped = false;
        this._gameStartTime = Date.now();
        this._updateScore();
        document.getElementById('snap-btn').disabled = false;

        this.botNum = this._randInt(1, 100);
        do { this.playerNum = this._randInt(1, 100); } while (this.playerNum === this.botNum);
        this._setWithPulse('bot-number',    this.botNum);
        this._setWithPulse('player-number', this.playerNum);

        this._scheduleBotChange();
        this._schedulePlayerChange();
        this._startMoving();
        this._startColorCycles();
        this._scheduleFirstMatch();
        this._resetSafetyTimer();
        this._startCountdown();
        this._gameEndTimer = setTimeout(() => this._endGame(), this._duration);
      },

      goToStart() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display  = '';
      },

      _endGame() {
        clearTimeout(this._botTimer);
        clearTimeout(this._playerTimer);
        clearTimeout(this._matchWindowTimer);
        clearTimeout(this._msgTimer);
        clearTimeout(this._greedyTimer);
        clearTimeout(this._firstMatchTimer);
        clearTimeout(this._safetyTimer);
        clearTimeout(this._gameEndTimer);
        this._stopCountdown();
        this._stopMoving();
        this._stopColorCycles();

        const best = parseInt(localStorage.getItem('slapwar-best') || '0', 10);
        if (this._peakScore > best) localStorage.setItem('slapwar-best', this._peakScore);
        const displayBest = Math.max(this._peakScore, best);

        const won = this.score > 0;
        const heading = document.getElementById('result-heading');
        heading.textContent = won ? 'YOU WIN!' : 'YOU LOST';
        heading.className   = won ? 'win' : 'lose';

        document.getElementById('final-score').textContent = this.score;
        document.getElementById('best-score').textContent  = displayBest;

        this.isMatch = false;
        this._justSnapped = false;

        document.getElementById('bot-number').textContent    = '--';
        document.getElementById('player-number').textContent = '--';
        document.getElementById('message').className         = '';
        document.getElementById('snap-btn').disabled         = false;

        document.getElementById('game-screen').style.display  = 'none';
        document.getElementById('result-screen').style.display = '';
      },

      // ── Match guarantees ──────────────────────────────────

      _scheduleFirstMatch() {
        const delay = this._randInt(this.FIRST_MATCH_MIN, this.FIRST_MATCH_MAX);
        this._firstMatchTimer = setTimeout(() => {
          if (!this.isMatch) {
            clearTimeout(this._botTimer);
            this.botNum = this.playerNum;
            this._setWithPulse('bot-number', this.botNum);
            this._checkMatch();
          }
        }, delay);
      },

      _resetSafetyTimer() {
        clearTimeout(this._safetyTimer);
        this._safetyTimer = setTimeout(() => {
          if (!this.isMatch) {
            clearTimeout(this._botTimer);
            this.botNum = this.playerNum;
            this._setWithPulse('bot-number', this.botNum);
            this._checkMatch();
          }
          this._resetSafetyTimer();
        }, this.SAFETY_WINDOW);
      },

      // ── Speed ramp (tied to selected duration) ────────────

      _speedFactor() {
        const elapsed = Date.now() - this._gameStartTime;
        const t = Math.min(elapsed / this._duration, 1);
        return 1.0 - t * (1.0 - this.SPEED_MIN_FACTOR);
      },

      _scaledRandInt(min, max) {
        const f = this._speedFactor();
        return this._randInt(Math.round(min * f), Math.round(max * f));
      },

      // ── Countdown ─────────────────────────────────────────

      _startCountdown() {
        const tick = () => {
          const remaining = Math.max(0, this._duration - (Date.now() - this._gameStartTime));
          const totalSecs = Math.ceil(remaining / 1000);
          const m = Math.floor(totalSecs / 60);
          const s = totalSecs % 60;
          document.getElementById('countdown').textContent = m + ':' + String(s).padStart(2, '0');
          if (remaining > 0) this._countdownTimer = setTimeout(tick, 200);
        };
        tick();
      },

      _stopCountdown() {
        clearTimeout(this._countdownTimer);
      },

      // ── Independent number timers ─────────────────────────

      _scheduleBotChange() {
        this._botTimer = setTimeout(() => {
          this.botNum = Math.random() < this.NUDGE_CHANCE
            ? this.playerNum
            : this._randInt(1, 100);
          this._setWithPulse('bot-number', this.botNum);
          this._checkMatch();
          if (!this.isMatch) this._scheduleBotChange();
        }, this._scaledRandInt(this.BOT_MIN, this.BOT_MAX));
      },

      _schedulePlayerChange() {
        this._playerTimer = setTimeout(() => {
          this.playerNum = this._randInt(1, 100);
          this._setWithPulse('player-number', this.playerNum);
          this._checkMatch();
          if (!this.isMatch) this._schedulePlayerChange();
        }, this._scaledRandInt(this.PLAY_MIN, this.PLAY_MAX));
      },

      // ── Match detection ───────────────────────────────────

      _checkMatch() {
        if (this.botNum !== this.playerNum) return;
        clearTimeout(this._botTimer);
        clearTimeout(this._playerTimer);
        clearTimeout(this._firstMatchTimer);
        this._resetSafetyTimer();
        this.isMatch = true;

        this._matchWindowTimer = setTimeout(() => {
          this.isMatch = false;
          this._divergeBoth();
          this._scheduleBotChange();
          this._schedulePlayerChange();
        }, this.MATCH_WINDOW);
      },

      // ── Player action ─────────────────────────────────────

      handleSnap() {
        if (this._justSnapped) {
          this.showMessage(this._pick(this._greedyMessages), 'fail');
          return;
        }

        if (this.isMatch) {
          this.isMatch = false;
          clearTimeout(this._matchWindowTimer);
          this.score += 5;
          if (this.score > this._peakScore) this._peakScore = this.score;
          this._updateScore();
          this.showMessage(this._pick(this._successMessages), 'success');
          this._glowNumbers();
          this._divergeBoth();

          this._justSnapped = true;
          clearTimeout(this._greedyTimer);
          this._greedyTimer = setTimeout(() => { this._justSnapped = false; }, this.MATCH_WINDOW);

          this._scheduleBotChange();
          this._schedulePlayerChange();
        } else {
          this._showMissPop();
          this.score -= 5;
          this._updateScore();
          this.showMessage(this.score < 0 ? 'In the red! -5 ⚠️' : 'Missed! -5', 'fail');
        }
      },

      // ── Button roaming ────────────────────────────────────

      _startMoving() {
        const btn = document.getElementById('snap-btn');
        // Anchor to current visual position before switching to fixed
        const rect = btn.getBoundingClientRect();
        btn.style.left = rect.left + 'px';
        btn.style.top  = rect.top  + 'px';
        btn.classList.add('roaming');
        // Small delay so browser registers the initial fixed coords first
        setTimeout(() => this._placeSnapBtn(), 50);
      },

      _placeSnapBtn() {
        const btn         = document.getElementById('snap-btn');
        const topPanel    = document.getElementById('bot-number').closest('.panel');
        const bottomPanel = document.getElementById('player-number').closest('.panel');
        const w   = btn.offsetWidth  || 200;
        const h   = btn.offsetHeight || 72;
        const pad = 14;

        // Constrain Y to the gap between the two number panels
        const safeTop    = topPanel.getBoundingClientRect().bottom + pad;
        const safeBottom = bottomPanel.getBoundingClientRect().top - h - pad;
        const maxX       = window.innerWidth - w - pad;

        btn.style.left = this._randInt(pad, Math.max(pad, maxX)) + 'px';
        btn.style.top  = this._randInt(safeTop, Math.max(safeTop, safeBottom)) + 'px';
        this._moveTimer = setTimeout(() => this._placeSnapBtn(), this._randInt(this.MOVE_MIN, this.MOVE_MAX));
      },

      _stopMoving() {
        clearTimeout(this._moveTimer);
        const btn = document.getElementById('snap-btn');
        btn.classList.remove('roaming');
        btn.style.left = '';
        btn.style.top  = '';
      },

      // ── Colour cycles ─────────────────────────────────────

      _startColorCycles() {
        this._cycleBotColor();
        this._cyclePlayerColor();
      },

      _cycleBotColor() {
        document.getElementById('bot-number').style.color = this._pick(this._colorPalette);
        this._botColorTimer = setTimeout(() => this._cycleBotColor(),
          this._randInt(this.BOT_COLOR_MIN, this.BOT_COLOR_MAX));
      },

      _cyclePlayerColor() {
        document.getElementById('player-number').style.color = this._pick(this._colorPalette);
        this._playerColorTimer = setTimeout(() => this._cyclePlayerColor(),
          this._randInt(this.PLAY_COLOR_MIN, this.PLAY_COLOR_MAX));
      },

      _stopColorCycles() {
        clearTimeout(this._botColorTimer);
        clearTimeout(this._playerColorTimer);
        document.getElementById('bot-number').style.color    = '';
        document.getElementById('player-number').style.color = '';
      },

      // ── Helpers ───────────────────────────────────────────

      showMessage(text, type) {
        const el = document.getElementById('message');
        clearTimeout(this._msgTimer);
        el.textContent = text;
        el.className = 'show ' + type;
        this._msgTimer = setTimeout(() => { el.className = ''; }, 1100);
      },

      _showMissPop() {
        const btn  = document.getElementById('snap-btn');
        const rect = btn.getBoundingClientRect();
        const el   = document.createElement('div');
        el.className   = 'miss-pop';
        el.textContent = this._pick(this._missWords);
        el.style.left  = (rect.left + rect.width / 2) + 'px';
        el.style.top   = rect.top + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 900);
      },

      _updateScore() {
        document.getElementById('score').textContent = this.score;
      },

      _setWithPulse(id, value) {
        const el = document.getElementById(id);
        el.textContent = value;
        el.classList.remove('pulse', 'glow');
        void el.offsetWidth;
        el.classList.add('pulse');
      },

      _glowNumbers() {
        ['bot-number', 'player-number'].forEach(id => {
          const el = document.getElementById(id);
          el.classList.add('glow');
          setTimeout(() => el.classList.remove('glow'), 600);
        });
      },

      // Immediately change both numbers so neither sits on the matched value
      _divergeBoth() {
        this.botNum = this._randInt(1, 100);
        this._setWithPulse('bot-number', this.botNum);
        do { this.playerNum = this._randInt(1, 100); } while (this.playerNum === this.botNum);
        this._setWithPulse('player-number', this.playerNum);
      },

      _pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      },

      _randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      },
    };

    // Space / Enter → SNAP in-game, Play Again on result screen
    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.code !== 'Space' && e.code !== 'Enter') return;
      e.preventDefault();
      const gs = document.getElementById('game-screen');
      const rs = document.getElementById('result-screen');
      if (gs.style.display !== 'none') { Game.handleSnap(); return; }
      if (rs.style.display !== 'none') { Game.goToStart(); return; }
    });
  </script>
</body>
</html>
